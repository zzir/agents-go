name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Test sandbox backend modules
        run: |
          (cd sandbox/docker && go vet ./... && go test ./...)
          (cd sandbox/ssh && go vet ./... && go test ./...)

      - name: Test sessions module
        run: (cd sessions && go vet ./... && go test ./...)

      - name: Test skills module
        run: (cd skills && go vet ./... && go test ./...)

      # -race, unlike the other submodules: these tests used to live in the root
      # module and so ran under the root's race step. mcp_locking_test.go exists
      # because that coverage caught something; plain `go test` would drop it.
      # examples/mcpserver has its own go.mod too, so root `go build ./...`
      # no longer reaches it.
      - name: Test mcp module
        run: |
          (cd mcp && go vet ./... && go test -race ./...)
          (cd examples/mcpserver && go vet ./... && go build -o /dev/null ./...)

      - name: Test models/anthropic module
        run: |
          (cd models/anthropic && go vet ./... && go test ./...)
          (cd examples/anthropic && go vet ./... && go build -o /dev/null ./...)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # package-lock.json is gitignored; key the npm cache on package.json instead.
          cache-dependency-path: cmd/agents-server/internal/web/frontend/package.json

      # The server embeds frontend/dist (go:embed), so the frontend must build
      # before the agents-server module can compile at all.
      - name: Frontend build
        run: cd cmd/agents-server/internal/web/frontend && npm install --ignore-scripts && npm run build

      - name: Test agents-server module
        run: (cd cmd/agents-server && go vet ./... && go test -race ./...)

      - name: Test tracing/otel module
        run: |
          (cd tracing/otel && go vet ./... && go test ./...)
          (cd examples/otel && go vet ./... && go build -o /dev/null ./...)

      # go build proves the examples compile; this proves they still run. A bad
      # struct tag or a nil provider is a runtime failure the compiler misses,
      # and the examples are what a reader copies first.
      - name: Examples run (fake model APIs)
        run: go run ./cmd/verifyexamples

      # The docs are the API's other surface and nothing compiled them; this
      # checks that snippets and links name things that exist.
      - name: Docs name things that exist
        run: go run ./cmd/verifydocs

      # Stale means "regenerating changes the file" — compared by content, so
      # a fresh-but-uncommitted regeneration passes locally and a clean CI
      # checkout still catches a forgotten commit.
      - name: OpenAPI spec up to date
        run: |
          cd cmd/agents-server
          before=$(git hash-object internal/docs/swagger.yaml)
          go tool swag init --v3.1 -g main.go --parseDependency --parseInternal -o internal/docs --outputTypes yaml --quiet
          after=$(git hash-object internal/docs/swagger.yaml)
          if [ "$before" != "$after" ]; then
            echo "::error::internal/docs is stale — run 'make openapi' in cmd/agents-server and commit the result."
            git diff internal/docs
            exit 1
          fi

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          # mcp is scanned explicitly: it used to be part of the root module, and
          # it is the module carrying the go-sdk's OAuth and jsonrpc2 code — the
          # split must not quietly drop it out of the scan.
          (cd mcp && govulncheck ./...)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/agents-server/internal/web/frontend/package.json
      # Linting agents-server needs the package to compile, and it embeds
      # frontend/dist — so the frontend builds here too.
      - name: Frontend build
        run: cd cmd/agents-server/internal/web/frontend && npm install --ignore-scripts && npm run build
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
      - name: golangci-lint (agents-server)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          working-directory: cmd/agents-server
      # mcp gets the full run too: it is a client with real logic, not a thin
      # backend adapter, and it was fully linted for free while it lived in the
      # root module.
      - name: golangci-lint (mcp)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
          working-directory: mcp
      # The three runs above cover root, agents-server and mcp (lint +
      # gofmt/goimports formatters). The support submodules don't run full
      # golangci, so check their formatting only — matching scripts/ci.sh.
      # (golangci-lint-action puts the binary on PATH for later steps.)
      - name: Verify formatting (gofmt + goimports)
        run: |
          for m in models/anthropic examples/anthropic examples/mcpserver examples/otel sandbox/docker sandbox/ssh sessions skills tracing/otel; do
            out=$(cd "$m" && golangci-lint fmt --diff)
            if [ -n "$out" ]; then
              echo "::error::$m is not gofmt/goimports-clean"; echo "$out"; exit 1
            fi
          done
