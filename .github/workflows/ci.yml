name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Test sandbox backend modules
        run: |
          (cd sandbox/docker && go vet ./... && go test ./...)
          (cd sandbox/ssh && go vet ./... && go test ./...)

      - name: Test sessions module
        run: (cd sessions && go vet ./... && go test ./...)

      - name: Test skills module
        run: (cd skills && go vet ./... && go test ./...)

      # go build proves the examples compile; this proves they still run. A bad
      # struct tag or a nil provider is a runtime failure the compiler misses,
      # and the examples are what a reader copies first.
      - name: Examples run (fake Responses API)
        run: go run ./cmd/verifyexamples

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12
      # `run` above covers the root module (lint + gofmt/goimports formatters).
      # The other modules don't run full golangci, so check their formatting here.
      # (golangci-lint-action puts the binary on PATH for later steps.)
      - name: Verify formatting (gofmt + goimports)
        run: |
          for m in cmd/agents-server sandbox/docker sandbox/ssh sessions skills; do
            out=$(cd "$m" && golangci-lint fmt --diff)
            if [ -n "$out" ]; then
              echo "::error::$m is not gofmt/goimports-clean"; echo "$out"; exit 1
            fi
          done
