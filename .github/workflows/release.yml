name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write # push images to GHCR (ghcr.io/zzir/agents-server)

jobs:
  release:
    runs-on: ubuntu-latest
    # The schema note checks PostgreSQL too; the database is wiped by the probe.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agents_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The changelog and git describe require a complete history and tags.

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
          cache: true
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # package-lock.json is gitignored; key the npm cache on package.json instead.
          cache-dependency-path: cmd/agents-server/internal/web/frontend/package.json

      # QEMU + buildx let goreleaser build the linux/arm64 image on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The root module's previous tag: --match keeps a submodule's prefixed tag out.
      - name: Previous root tag
        run: echo "PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^")" >> "$GITHUB_ENV"

      # A patch tag whose exported API breaks the previous tag's stops here (decisions §5.8).
      - name: A patch release carries no API break
        run: ./scripts/release-check.sh "$GITHUB_REF_NAME"

      # Every library module is tagged at this version on this commit (decisions §5.7).
      - name: The library modules are tagged in lockstep
        run: ./scripts/release-prep.sh --verify "$GITHUB_REF_NAME"

      # One line for the release header; the script exits 0 whatever it finds.
      - name: Workbench schema note
        run: echo "SCHEMA_NOTE=$(./scripts/schema-compat.sh "$PREV_TAG" --pg 'postgres://postgres:test@localhost:5432/agents_test?sslmode=disable')" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The commit carries the library modules' prefixed tags too: name the root's.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ env.PREV_TAG }}
