name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write # push images to GHCR (ghcr.io/zzir/agents-server)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The changelog and git describe require a complete history and tags.

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          check-latest: true
          cache: true
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # package-lock.json is gitignored; key the npm cache on package.json instead.
          cache-dependency-path: cmd/agents-server/internal/web/frontend/package.json

      # QEMU + buildx let goreleaser build the linux/arm64 image on the amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
