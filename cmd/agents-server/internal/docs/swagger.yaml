components:
  schemas:
    agents.InputTokensDetails:
      description: InputTokensDetails aggregates the input token detail fields.
      properties:
        cached_tokens:
          type: integer
      type: object
    agents.ModelSettings:
      description: |-
        ModelSettings, when set, replaces the agent's configured settings — the
        replay dialog seeds it from the traced request so edits take effect.
      properties:
        frequency_penalty:
          type: number
        max_tokens:
          description: MaxTokens is the maximum number of output tokens to generate.
          type: integer
        metadata:
          additionalProperties:
            type: string
          description: Metadata is included with the model response call.
          type: object
        parallel_tool_calls:
          description: |-
            ParallelToolCalls controls whether the model may emit multiple tool calls
            in a single turn. nil defers to the provider default.
          type: boolean
        presence_penalty:
          type: number
        prompt_cache_retention:
          description: PromptCacheRetention is "in_memory" or "24h".
          type: string
        reasoning:
          $ref: '#/components/schemas/agents.Reasoning'
        response_include:
          description: ResponseInclude lists additional output data to include in
            the response.
          items:
            type: string
          type: array
          uniqueItems: false
        service_tier:
          description: 'ServiceTier selects the processing tier: "auto", "default",
            "flex" or "priority".'
          type: string
        store:
          description: Store controls whether the provider stores the response for
            later retrieval.
          type: boolean
        temperature:
          type: number
        tool_choice:
          $ref: '#/components/schemas/agents.ToolChoice'
        top_logprobs:
          description: TopLogprobs requests logprobs for the top N tokens.
          type: integer
        top_p:
          type: number
        truncation:
          description: Truncation is "auto" or "disabled". Empty means unset.
          type: string
        verbosity:
          description: 'Verbosity constrains response verbosity: "low", "medium" or
            "high".'
          type: string
      type: object
    agents.OutputTokensDetails:
      description: OutputTokensDetails aggregates the output token detail fields.
      properties:
        reasoning_tokens:
          type: integer
      type: object
    agents.Reasoning:
      description: Reasoning configures reasoning models.
      properties:
        effort:
          description: Effort is "minimal", "low", "medium" or "high".
          type: string
        summary:
          description: Summary is "auto", "concise" or "detailed".
          type: string
      type: object
    agents.RequestUsage:
      properties:
        input_tokens:
          type: integer
        input_tokens_details:
          $ref: '#/components/schemas/agents.InputTokensDetails'
        output_tokens:
          type: integer
        output_tokens_details:
          $ref: '#/components/schemas/agents.OutputTokensDetails'
        total_tokens:
          type: integer
      type: object
    agents.ToolChoice:
      description: ToolChoice controls tool selection. Empty means unset.
      enum:
      - auto
      - required
      - none
      type: string
      x-enum-varnames:
      - ToolChoiceAuto
      - ToolChoiceRequired
      - ToolChoiceNone
    agents.Usage:
      properties:
        input_tokens:
          description: InputTokens is the total input tokens sent across all requests.
          type: integer
        input_tokens_details:
          $ref: '#/components/schemas/agents.InputTokensDetails'
        output_tokens:
          description: OutputTokens is the total output tokens received across all
            requests.
          type: integer
        output_tokens_details:
          $ref: '#/components/schemas/agents.OutputTokensDetails'
        request_usage_entries:
          description: RequestUsageEntries preserves the per-request usage breakdown.
          items:
            $ref: '#/components/schemas/agents.RequestUsage'
          type: array
          uniqueItems: false
        requests:
          description: Requests is the total number of LLM API calls made.
          type: integer
        total_tokens:
          description: TotalTokens is the total tokens sent and received across all
            requests.
          type: integer
      type: object
    bridge.ChatGPTLoginResult:
      properties:
        authorize_url:
          type: string
        state:
          type: string
      type: object
    bridge.RunInfo:
      properties:
        agent_config_id:
          type: string
        last_seq:
          type: integer
        run_id:
          type: string
        sandbox_id:
          type: string
        session_id:
          type: string
        status:
          $ref: '#/components/schemas/bridge.RunStatus'
      type: object
    bridge.RunStatus:
      enum:
      - running
      - interrupted
      - completed
      - error
      - cancelled
      type: string
      x-enum-varnames:
      - RunRunning
      - RunInterrupted
      - RunCompleted
      - RunErrored
      - RunCancelled
    handler.APIError:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    handler.ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/handler.APIError'
      type: object
    handler.agentConfigReq:
      properties:
        api_key:
          type: string
        approve_tools:
          type: string
        auth_mode:
          type: string
        base_url:
          type: string
        compaction_enabled:
          type: boolean
        compaction_model:
          type: string
        compaction_prompt:
          type: string
        compaction_threshold:
          type: integer
        compaction_window:
          type: integer
        disable_tool_choice_reset:
          type: boolean
        fallback_models:
          type: string
        handoff_description:
          type: string
        handoff_input_filter:
          type: string
        handoffs:
          type: string
        input_guardrails:
          type: string
        instructions:
          type: string
        max_tool_concurrency:
          type: integer
        max_turns:
          type: integer
        model:
          type: string
        model_settings:
          type: string
        name:
          type: string
        output_guardrails:
          type: string
        output_schema:
          type: string
        prompt_id:
          type: string
        prompt_version:
          type: string
        provider_type:
          type: string
        retry_enabled:
          type: boolean
        retry_policy:
          type: string
        skills:
          type: string
        tool_not_found_behavior:
          type: string
        tool_use_behavior:
          type: string
        tools:
          type: string
        use_previous_response_id:
          type: boolean
      type: object
    handler.approvalResultResp:
      properties:
        run_id:
          type: string
        status:
          type: string
      type: object
    handler.approveReq:
      properties:
        scope:
          type: string
      type: object
    handler.chatgptStatusResp:
      properties:
        logged_in:
          type: boolean
      type: object
    handler.cloneRequest:
      properties:
        url:
          type: string
      required:
      - url
      type: object
    handler.createRunReq:
      properties:
        agent_config_id:
          type: string
        input:
          type: string
        sandbox_id:
          type: string
      type: object
    handler.createRunResp:
      properties:
        run_id:
          type: string
        session_id:
          type: string
        status:
          type: string
      type: object
    handler.createSandboxReq:
      properties:
        config:
          items:
            type: integer
          type: array
          uniqueItems: false
        name:
          type: string
        type:
          type: string
      type: object
    handler.mcpConnectResp:
      properties:
        authorize_url:
          type: string
        state:
          type: string
        status:
          type: string
      type: object
    handler.mcpServerListItem:
      properties:
        auth_state:
          type: string
        config:
          description: |-
            Config holds the transport-specific settings as JSON: StdioMcpConfig for
            "stdio", HTTPMcpConfig for "streamable_http". Stored as TEXT and
            exchanged with the API as a raw JSON object.
          items:
            type: integer
          type: array
          uniqueItems: false
        connected:
          type: boolean
        created_at:
          type: string
        enabled:
          type: boolean
        id:
          type: string
        name:
          type: string
        transport_type:
          description: stdio | streamable_http
          type: string
        updated_at:
          type: string
      type: object
    handler.mcpServerReq:
      properties:
        config:
          description: |-
            Config is the transport-specific settings object, interpreted per
            TransportType (see store.StdioMcpConfig / store.HTTPMcpConfig).
          items:
            type: integer
          type: array
          uniqueItems: false
        enabled:
          type: boolean
        name:
          type: string
        transport_type:
          type: string
      type: object
    handler.mcpToolInfo:
      properties:
        description:
          type: string
        name:
          type: string
      type: object
    handler.memoryReq:
      properties:
        agent_config_id:
          type: string
        content:
          type: string
        key:
          type: string
        metadata:
          type: string
      type: object
    handler.playgroundReq:
      properties:
        agent_config_id:
          description: AgentConfigID selects whose provider credentials and default
            model to use.
          type: string
        input_items:
          description: InputItems are Responses-format input items, as edited by the
            user.
          items:
            items:
              type: integer
            type: array
          type: array
          uniqueItems: false
        model:
          description: Model optionally overrides the agent's model.
          type: string
        model_settings:
          $ref: '#/components/schemas/agents.ModelSettings'
        system_instructions:
          description: SystemInstructions is the system prompt to send.
          type: string
        tools:
          description: |-
            Tools are schema-only tool definitions echoed back from the traced
            request, so the model sees the same tool surface and can emit function
            calls. They are never executed: a single GetResponse runs no tool loop.
          items:
            $ref: '#/components/schemas/handler.playgroundTool'
          type: array
          uniqueItems: false
      type: object
    handler.playgroundResp:
      properties:
        duration_ms:
          type: integer
        output:
          items:
            type: integer
          type: array
          uniqueItems: false
        usage:
          $ref: '#/components/schemas/agents.Usage'
      type: object
    handler.playgroundTool:
      properties:
        description:
          type: string
        name:
          type: string
        parameters:
          additionalProperties: {}
          type: object
      type: object
    handler.providerRouteReq:
      properties:
        api_key:
          type: string
        base_url:
          type: string
        prefix:
          type: string
      type: object
    handler.rejectReq:
      properties:
        reason:
          type: string
      type: object
    handler.sandboxTestResp:
      properties:
        detail:
          type: string
        ok:
          type: boolean
      type: object
    handler.sessionCreateReq:
      properties:
        agent_config_id:
          description: AgentConfigID optionally binds the session to an agent up front.
          type: string
        name:
          type: string
      type: object
    handler.sessionPatchReq:
      properties:
        name:
          type: string
        pinned:
          type: boolean
      type: object
    handler.setSettingReq:
      properties:
        value:
          type: string
      type: object
    handler.skillContentResp:
      properties:
        content:
          type: string
        name:
          type: string
        path:
          type: string
      type: object
    handler.skillEntry:
      properties:
        description:
          type: string
        name:
          type: string
        path:
          type: string
      type: object
    handler.skillRepoResp:
      properties:
        name:
          type: string
        skills:
          items:
            $ref: '#/components/schemas/handler.skillEntry'
          type: array
          uniqueItems: false
      type: object
    store.AgentConfig:
      properties:
        api_key:
          type: string
        approve_tools:
          description: 'Batch 6: HITL approval'
          type: string
        auth_mode:
          type: string
        base_url:
          type: string
        compaction_enabled:
          description: 'Batch 7: compaction'
          type: boolean
        compaction_model:
          type: string
        compaction_prompt:
          type: string
        compaction_threshold:
          type: integer
        compaction_window:
          type: integer
        created_at:
          type: string
        disable_tool_choice_reset:
          type: boolean
        fallback_models:
          type: string
        handoff_description:
          type: string
        handoff_input_filter:
          description: 'Batch 5: fine-grained control'
          type: string
        handoffs:
          type: string
        id:
          type: string
        input_guardrails:
          description: 'Batch 3: guardrails + output type'
          type: string
        instructions:
          type: string
        max_tool_concurrency:
          type: integer
        max_turns:
          description: 'Batch 1: basic correctness'
          type: integer
        model:
          type: string
        model_settings:
          type: string
        name:
          type: string
        output_guardrails:
          type: string
        output_schema:
          type: string
        prompt_id:
          type: string
        prompt_version:
          type: string
        provider_type:
          type: string
        retry_enabled:
          description: 'Batch 2: model resilience'
          type: boolean
        retry_policy:
          type: string
        skills:
          type: string
        tool_not_found_behavior:
          type: string
        tool_use_behavior:
          type: string
        tools:
          type: string
        updated_at:
          type: string
        use_previous_response_id:
          description: 'Batch 4: session features'
          type: boolean
      type: object
    store.Guardrail:
      properties:
        config:
          items:
            type: integer
          type: array
          uniqueItems: false
        created_at:
          type: string
        description:
          type: string
        id:
          type: string
        mode:
          description: regex | max_length
          type: string
        name:
          type: string
        type:
          description: input | output
          type: string
        updated_at:
          type: string
      type: object
    store.McpServerConfig:
      properties:
        config:
          description: |-
            Config holds the transport-specific settings as JSON: StdioMcpConfig for
            "stdio", HTTPMcpConfig for "streamable_http". Stored as TEXT and
            exchanged with the API as a raw JSON object.
          items:
            type: integer
          type: array
          uniqueItems: false
        created_at:
          type: string
        enabled:
          type: boolean
        id:
          type: string
        name:
          type: string
        transport_type:
          description: stdio | streamable_http
          type: string
        updated_at:
          type: string
      type: object
    store.Memory:
      properties:
        agent_config_id:
          type: string
        content:
          type: string
        created_at:
          type: string
        id:
          type: string
        key:
          type: string
        metadata:
          type: string
        updated_at:
          type: string
      type: object
    store.Message:
      properties:
        compacted:
          type: boolean
        content:
          type: string
        created_at:
          type: string
        display:
          description: |-
            Display carries the structured fields the UI renders for non-text rows
            (tool call name/arguments/output), derived from Item at write time.
          items:
            type: integer
          type: array
          uniqueItems: false
        id:
          type: integer
        kind:
          type: string
        role:
          type: string
        run_id:
          type: string
        session_id:
          type: string
      type: object
    store.PendingApproval:
      properties:
        agent_config_id:
          type: string
        created_at:
          type: string
        run_id:
          type: string
        sandbox_id:
          type: string
        session_id:
          type: string
        tool_calls:
          description: |-
            ToolCalls is the JSON array of pending tool calls ([]PendingToolCall)
            shown to the user.
          items:
            type: integer
          type: array
          uniqueItems: false
        user_input:
          description: |-
            UserInput is the text of the message that started this paused turn. The
            SDK only persists the turn to `messages` on completion, so during the
            pause this is the only place the user's prompt is stored — the UI
            reconstructs the user bubble from it on reload.
          type: string
      type: object
    store.ProviderRoute:
      properties:
        api_key:
          type: string
        base_url:
          type: string
        created_at:
          type: string
        id:
          type: string
        prefix:
          type: string
        updated_at:
          type: string
      type: object
    store.SandboxConfig:
      properties:
        config:
          description: |-
            Config holds the backend-specific settings as JSON: LocalConfig for
            "local", DockerConfig for "docker", SSHConfig for "ssh". Stored as TEXT
            and sent to/received from the API as a raw JSON object (no
            double-encoding).
          items:
            type: integer
          type: array
          uniqueItems: false
        created_at:
          type: string
        id:
          type: string
        name:
          type: string
        type:
          description: local | docker | ssh
          type: string
        updated_at:
          type: string
      type: object
    store.Session:
      properties:
        agent_config_id:
          type: string
        created_at:
          type: string
        id:
          type: string
        name:
          type: string
        pinned:
          type: boolean
        updated_at:
          type: string
      type: object
    store.Setting:
      properties:
        key:
          type: string
        value:
          type: string
      type: object
    store.TraceEvent:
      properties:
        created_at:
          type: string
        data:
          type: string
        detail:
          type: string
        ended_at:
          type: string
        error:
          type: string
        id:
          type: integer
        kind:
          type: string
        name:
          type: string
        parent_id:
          type: string
        run_id:
          type: string
        session_id:
          type: string
        span_id:
          type: string
        started_at:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Value is "Bearer <token>" — the token printed at server startup
        (or set via --token).
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: 'REST API of agents-server, the web server over the agents-go SDK:
    sessions, agents, MCP servers, memories, settings, skills, provider routes, guardrails,
    and sandboxes. Runs are started over the WebSocket protocol (see the README);
    this spec covers the HTTP surface.'
  title: agents-server API
  version: "1.0"
openapi: 3.1.0
paths:
  /agents:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/store.AgentConfig'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - agents
    post:
      description: 'Secret fields (api_key, fallback_models[].api_key) are write-only:
        responses mask them with ********; sending the mask back keeps the stored
        value, "" clears it. use_previous_response_id is rejected (incompatible with
        the server-side session store), as are tool selections whose statically known
        tool names would collide.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.agentConfigReq'
                description: Agent configuration
                summary: agent
        description: Agent configuration
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.AgentConfig'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create agent
      tags:
      - agents
  /agents/{id}:
    delete:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: deleted
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete agent
      tags:
      - agents
    get:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.AgentConfig'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get agent
      tags:
      - agents
    put:
      description: 'Full replace. Secret fields are write-only: send back the ********
        mask to keep the stored value, "" to clear it. use_previous_response_id is
        rejected (incompatible with the server-side session store), as are tool selections
        whose statically known tool names would collide.'
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.agentConfigReq'
                description: Agent configuration
                summary: agent
        description: Agent configuration
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.AgentConfig'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update agent
      tags:
      - agents
  /agents/{id}/chatgpt/login:
    post:
      description: Starts the OAuth flow; open authorize_url in a browser. The callback
        is served by a temporary local server on port 1455.
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bridge.ChatGPTLoginResult'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Start ChatGPT login
      tags:
      - agents
  /agents/{id}/chatgpt/logout:
    post:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: logged out
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: ChatGPT logout
      tags:
      - agents
  /agents/{id}/chatgpt/status:
    get:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.chatgptStatusResp'
          description: OK
      security:
      - BearerAuth: []
      summary: ChatGPT login status
      tags:
      - agents
  /approvals/{tool_call_id}/approve:
    post:
      description: 'Approves a pending tool call and resumes the run under its original
        run id; stream it via GET /runs/{id}/events (existing cursors stay valid).
        For exec_command, the optional body scope extends the approval: "once" (default),
        "same" (trust this exact command for the session), or "all" (trust every command).'
      parameters:
      - description: Tool call ID
        in: path
        name: tool_call_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.approveReq'
                description: Optional approval scope
                summary: body
        description: Optional approval scope
