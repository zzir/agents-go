  /sessions/{id}/compact:
    post:
      description: Folds the session's active branch down to its kept window plus
        a summary checkpoint, regardless of the threshold — the Context panel's "Compact
        now". A 200 with compacted=false means there was nothing to fold (the kept
        window already covers the history). Fails 409 while a run is executing and
        400 when the session's agent has compaction disabled or no usable provider.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.CompactResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: session already has an active run
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Compact session history
      tags:
      - sessions
  /sessions/{id}/context:
    get:
      description: 'What the session''s active branch occupies of its model''s context
        window: the last call''s provider token counts, the session totals, the per-call
        growth curve, the compaction estimate, and the heaviest entries still in context.
        Window figures are the provider''s; compaction figures and item sizes are
        character estimates — the two are not the same ruler.'
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
