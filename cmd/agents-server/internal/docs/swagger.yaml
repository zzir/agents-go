          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create guardrail
      tags:
      - guardrails
  /guardrails/{id}:
    delete:
      parameters:
      - description: Guardrail ID
        in: path
        name: id
