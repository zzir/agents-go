      - description: Session ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Max messages to return; 0 or absent returns all
        in: query
        name: limit
        schema:
          type: integer
      - description: Only messages with id < before_id (backwards cursor)
        in: query
        name: before_id
