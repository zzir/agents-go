      description: 'Known keys: proxy_url, system_prompt, brave_api_key (secret, masked).'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/store.Setting'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List settings
      tags:
      - settings
  /settings/{key}:
    delete:
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        "204":
          description: deleted
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete setting
      tags:
      - settings
    get:
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.Setting'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get setting
      tags:
      - settings
    put:
      parameters:
      - description: Setting key
        in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.setSettingReq'
                description: Value to store
                summary: setting
        description: Value to store
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.Setting'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Set setting
      tags:
      - settings
  /skill-repos:
    post:
      description: git clone --depth=1 of an http(s) repository containing SKILL.md
        files.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.cloneRequest'
                description: Repository URL (http/https only)
                summary: repo
        description: Repository URL (http/https only)
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.skillRepoResp'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: directory already exists
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: git clone failed
      security:
      - BearerAuth: []
      summary: Clone skill repo
      tags:
      - skill-repos
  /skill-repos/{name}:
    delete:
      parameters:
      - description: Repo directory name
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: deleted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete skill repo
      tags:
      - skill-repos
  /skill-repos/{name}/sync:
    post:
      description: git fetch + reset --hard origin/HEAD; local changes in the repo
        are discarded.
      parameters:
      - description: Repo directory name
        in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.skillRepoResp'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: not a git repository
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: git fetch failed
      security:
      - BearerAuth: []
      summary: Sync skill repo
      tags:
      - skill-repos
  /skills:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/handler.skillEntry'
                type: array
          description: OK
      security:
      - BearerAuth: []
      summary: List skills
      tags:
      - skills
  /skills/{path}:
    get:
      parameters:
      - description: Skill path (may be nested, e.g. repo/sub-skill)
        in: path
        name: path
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.skillContentResp'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Get skill content
      tags:
      - skills
  /tasks/{id}/stop:
    post:
      description: Cancels a running task, or discards the pending approval of a paused
        one. Errors if the task is already final.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.taskStopReq'
                description: Stop options
                summary: request
        description: Stop options
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bridge.TaskInfo'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Conflict
      security:
      - BearerAuth: []
      summary: Stop a background task
      tags:
      - tasks
servers:
- url: /api/v1
