        id:
          type: string
        last_used_at:
          type: string
        name:
          type: string
      type: object
    protocol.UserInfo:
      properties:
        avatar_url:
          description: AvatarURL is the login provider's picture, when it gave one.
          type: string
        email:
          type: string
        id:
          type: string
        name:
          type: string
        role:
          type: string
      type: object
    providers.ChatGPTLoginResult:
      properties:
        authorize_url:
          type: string
        state:
          type: string
      type: object
    providers.TypeInfo:
      properties:
        auth_modes:
          description: |-
            AuthModes and Unsupported serialize as [] rather than being omitted:
            a client caching these facts must be able to tell "this backend has
            none" apart from "not fetched yet" — omitempty would make an emptied
            list look like missing data and let a stale local fallback win.
          items:
            type: string
          type: array
          uniqueItems: false
        type:
          type: string
        unsupported:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    session.DiagnosticType:
      enum:
      - model_retry
      - model_fallback
      - stream_error
      - tool_panic
      - tool_timeout
      - compaction_failed
      - response_truncated
      - context_overflow
      type: string
      x-enum-varnames:
      - DiagModelRetry
      - DiagModelFallback
      - DiagStreamError
      - DiagToolPanic
      - DiagToolTimeout
      - DiagCompactionFailed
      - DiagResponseTruncated
      - DiagContextOverflow
    session.ErrorCode:
      description: Code classifies the underlying error, when there was one.
      enum:
      - unknown
      - max_turns_exceeded
      - model_behavior
      - model_refusal
      - user_error
      - tool_timeout
      - tool_loop
      - tool_panic
      - guardrail_tripwire
      - sandbox_exec
      - mcp
      type: string
      x-enum-varnames:
      - CodeUnknown
      - CodeMaxTurns
      - CodeModelBehavior
      - CodeModelRefusal
      - CodeUserError
      - CodeToolTimeout
      - CodeToolLoop
      - CodeToolPanic
      - CodeGuardrailTripwire
      - CodeSandboxExec
      - CodeMCP
    session.InputTokensDetails:
      description: InputTokensDetails aggregates the input token detail fields.
      properties:
        cache_write_tokens:
          description: |-
            CacheWriteTokens counts input tokens written to the prompt cache (surfaced
            by providers that bill cache writes separately). Older serialized RunState
            snapshots without the field decode to zero.
          type: integer
        cached_tokens:
          type: integer
      type: object
    session.OutputTokensDetails:
      description: OutputTokensDetails aggregates the output token detail fields.
      properties:
        reasoning_tokens:
          type: integer
      type: object
    settings.Def:
      properties:
        default:
          description: |-
            Default is the value that applies when the setting is unset. Empty means
            the feature is off (or, for KeyTraceIncludeSensitiveData, that the SDK
            decides) — never "the zero value happens to be right".
          type: string
        description:
          type: string
        group:
          type: string
        key:
          type: string
        kind:
          $ref: '#/components/schemas/settings.Kind'
        label:
          type: string
        max:
          type: integer
        min:
          description: Min and Max bound a KindInt value. A zero Max means unbounded.
          type: integer
        placeholder:
          type: string
      type: object
    settings.Kind:
      enum:
      - string
      - text
      - secret
      - int
      - bool
      type: string
      x-enum-comments:
        KindSecret: masked on read, sentinel-resolved on write
        KindString: single-line free text
        KindText: multi-line free text
      x-enum-varnames:
      - KindString
      - KindText
      - KindSecret
      - KindInt
      - KindBool
    store.AgentConfig:
      properties:
        approval:
          $ref: '#/components/schemas/store.ApprovalGroup'
        behavior:
          $ref: '#/components/schemas/store.BehaviorGroup'
        compaction:
          $ref: '#/components/schemas/store.CompactionGroup'
        context_window:
          description: |-
            ContextWindow is the model's window in tokens, declared rather than
            discovered — no provider reports it on a response. It sits beside Model
            because it describes the model, not the endpoint: two agents on one
            provider may run different models. 0 leaves the Context panel showing
            occupancy without a denominator.
          type: integer
        created_at:
          type: string
        description:
          description: |-
            Description is what this agent is FOR, in a sentence — the text an
            automatic agent picker will match a request against (not the model-facing
            instructions).
          type: string
        error_handlers:
          description: |-
            ErrorHandlers is a JSON object keyed by error kind (max_turns /
            model_refusal / invalid_final_output), each entry carrying a static
            final_output (a JSON value) and an optional exclude_from_history flag.
            Empty means every run error stays fatal.
          type: string
        guardrails:
          $ref: '#/components/schemas/store.GuardrailGroup'
        handoffs:
          type: string
        id:
          type: string
        instructions:
          type: string
        model:
          type: string
        model_settings:
          description: The following are already single JSON blobs, kept as their
            own columns.
          type: string
        name:
          type: string
        owner_id:
          type: string
        provider_id:
          description: |-
            ProviderID names the Provider row this agent reaches its model through —
            a COLUMN rather than a field in a JSON group, because it is a reference
            and referential integrity has to be expressible in SQL (the same reason
            sessions.sandbox_id is one). Empty reaches no credential: the run fails
            its pre-flight until the agent names a provider (decisions §5.30).
          type: string
        resilience:
          $ref: '#/components/schemas/store.ResilienceGroup'
        scope:
          description: 'Scope/OwnerID: row visibility and its permanent creator —
            decisions §5.29.'
          type: string
        session:
          $ref: '#/components/schemas/store.SessionGroup'
        skills:
          type: string
        tools:
          type: string
        updated_at:
          type: string
      type: object
    store.ApprovalGroup:
      properties:
        approve_tools:
          type: string
      type: object
    store.AuditEvent:
      properties:
        action:
          description: |-
            Action is "METHOD /route/pattern" for REST, or a dotted name for the
            explicit events (ws.run.create, ws.approval, terminal.open).
          type: string
        actor_email:
          type: string
        actor_id:
          description: |-
            ActorID/ActorEmail identify the caller; the email is a snapshot so the
            line stays readable after the account is gone.
          type: string
        client_ip:
          type: string
        created_at:
          type: string
        detail:
          type: string
        id:
          type: string
        resource:
          type: string
      type: object
    store.BehaviorGroup:
      description: |-
        The remaining knobs are grouped into JSON category columns (see
        agent_config_groups.go) so the table holds only category columns and a new
        setting needs no schema change. In the REST API each is a nested object.
      properties:
        disable_tool_choice_reset:
          type: boolean
        handoff_description:
          type: string
        handoff_input_filter:
          type: string
        max_tool_concurrency:
          type: integer
        max_turns:
          type: integer
        reasoning_item_id_policy:
          description: |-
            ReasoningItemIDPolicy is "" / "preserve" (keep reasoning-item ids across
            turns) or "omit" (strip them).
          type: string
        stop_at_tools:
          description: |-
            StopAtTools is a comma-separated list of tool names; the run ends after a
            turn that called any of them, instead of feeding the results back to the
            model. Empty means the run continues until the model stops on its own.
          type: string
        tool_not_found_behavior:
          type: string
        workflow_authoring:
          description: |-
            WorkflowAuthoring gives the agent's chat runs get_workflow / save_workflow
            (workbench invariant 39). Off by default: the save schema costs every request.
          type: boolean
      type: object
    store.CompactionGroup:
      properties:
        compaction_enabled:
          type: boolean
        compaction_model:
          type: string
        compaction_prompt:
          type: string
        compaction_threshold_tokens:
          description: |-
            Threshold is in TOKENS. The key is compaction_threshold_tokens — a NEW
            name because the earlier compaction_threshold counted ENTRIES, and
            reinterpreting a stored 20 as tokens would compact on every turn. Legacy
            rows decode past the old key and fall back to the default.
          type: integer
        compaction_window:
          type: integer
      type: object
    store.CompactionInfo:
      description: |-
        Compaction is present on a checkpoint: what the pass folded away, so a
        reader can collapse those entries under it and offer them back.
      properties:
        excluded_ids:
          description: |-
            ExcludedIDs are the entries this checkpoint folded away. They are still
            in the session, marked compacted; this is what lets a reader collapse
            them under the checkpoint instead of leaving them loose in the history.
          items:
            type: string
          type: array
          uniqueItems: false
        tokens_after:
          type: integer
        tokens_before:
          type: integer
      type: object
    store.ContextReport:
      properties:
        cache_write_tokens:
          type: integer
        cached_tokens:
          description: |-
            CachedTokens / CacheWriteTokens split that call's input by cache
            disposition, for providers that report it.
          type: integer
        compaction_enabled:
          description: |-
            CompactionEnabled reports whether the pass runs at all; Threshold is what
            it fires at (the default filled in when the config names none) and Tokens
            is what it compares — ActiveContextTokens over the same history, so the
            number the panel draws is the number that trips.
          type: boolean
        compaction_threshold:
          type: integer
        compaction_tokens:
          type: integer
        context_window:
          description: |-
            ContextWindow is the agent config's declared window in tokens; 0 means
            unconfigured and the client shows occupancy without a denominator.
          type: integer
        conversation_tokens:
          description: |-
            ConversationTokens is the estimated size of the transcript still in
            context — every active, uncompacted entry's estimate summed. The
            conversation's share of the window, on the same ruler as Prompt.
          type: integer
        growth:
          description: |-
            Growth is each model call's input tokens in order — the curve the panel
            draws, where a compaction pass shows up as the drop it caused.
          items:
            type: integer
          type: array
          uniqueItems: false
        input_tokens:
          description: |-
            InputTokens is what the LAST model call on the branch sent — the history,
            prompt and tool schemas that are in the window right now. OutputTokens is
            that same call's completion.
          type: integer
        model:
          type: string
        output_tokens:
          type: integer
        prompt:
          $ref: '#/components/schemas/store.PromptProfile'
        session_input_tokens:
          description: |-
            SessionInputTokens / SessionOutputTokens total every model call on the
            branch. Input counts re-sent history once per call, so it runs far ahead
            of InputTokens by design — it is a spend figure, not a window figure.
          type: integer
        session_output_tokens:
          type: integer
      type: object
    store.EntryView:
      properties:
        compacted:
          type: boolean
        compaction:
          $ref: '#/components/schemas/store.CompactionInfo'
        content:
          description: Content is the readable text, for a renderer that wants one
            string.
          type: string
        created_at:
          type: string
        diagnostics:
          items:
            $ref: '#/components/schemas/agents.Diagnostic'
          type: array
          uniqueItems: false
        display:
          $ref: '#/components/schemas/agents.ItemDisplay'
        entry_id:
          type: string
        id:
          type: string
        kind:
          type: string
        on_path:
          description: |-
            OnPath reports whether this entry is on the session's ACTIVE branch. An
            off-path entry is an abandoned attempt — still recorded, still offerable,
            but not part of the conversation as it currently stands.
          type: boolean
        parent_id:
          type: string
        role:
          description: |-
            Role is who produced the entry, from its recorded provenance rather than
            re-parsed from the item.
          type: string
        run_id:
          type: string
        usage:
          $ref: '#/components/schemas/agents.RequestUsage'
      type: object
    store.EnvVar:
      properties:
        key:
          type: string
        value:
          type: string
      type: object
    store.Guardrail:
      properties:
        blocking:
          description: |-
            Blocking, at the input stage, runs the guardrail to completion BEFORE the
            first model call (a gate) instead of racing it — a tripwire then prevents
            the call and any token spend. No effect at the other stages.
          type: boolean
        config:
          items:
            type: integer
          type: array
          uniqueItems: false
        created_at:
          type: string
        description:
          type: string
        id:
          type: string
        mode:
          description: regex | max_length
          type: string
        name:
          type: string
        stages:
          description: |-
            Stages are the run stages this guardrail inspects: input, output,
            tool_input, tool_output. One definition covering several is the SDK's
            model — a content scanner that should see the input, the tool arguments
            and the final output is one guardrail, not three near-identical copies.
          items:
            type: string
          type: array
          uniqueItems: false
        updated_at:
          type: string
      type: object
    store.GuardrailGroup:
      properties:
        guardrails:
          description: |-
            Guardrails is a JSON array of guardrail names. One list, not one per
            stage: a guardrail carries the stages it inspects, so naming it twice
            would be naming the same value twice.
          type: string
        output_schema:
          type: string
      type: object
    store.Memory:
      properties:
        agent_config_id:
          type: string
        content:
          type: string
        created_at:
          type: string
        id:
          type: string
        key:
          type: string
        metadata:
          type: string
        updated_at:
          type: string
      type: object
    store.Project:
      properties:
        created_at:
          type: string
        id:
          type: string
        name:
          description: |-
            Name is display only — the storage is keyed by ID, so a rename moves
            nothing. Unique per (owner, sandbox) via idx_projects_owner_sandbox_name.
          type: string
        owner_id:
          type: string
        revision:
          description: |-
            Revision and RuntimeGen are the two counters SandboxConfig carries, for
            the same two jobs: the expected-revision CAS every update lands
            against, and the content generation that retires live containers — so
            a rename does not replace anyone's container.
          type: integer
        sandbox_id:
          type: string
        session_count:
          description: |-
            SessionCount is how many sessions bind this project — filled by List
            (scanonly), so a delete knows whether it will be refused.
          type: integer
        storage_hint:
          description: |-
            StorageHint names where the files live — the local daemon's host
            directory or the remote daemon's volume. Derived per response by the
            handler for admins only, never stored: deleting the row keeps the
            storage (decisions §5.28), so the UI can say where.
          type: string
        updated_at:
          type: string
      type: object
    store.PromptProfile:
      description: |-
        Prompt is what the session's last build put in front of the conversation
        — the instruction layers and the tool surface, in the same estimated
        characters as CompactionTokens. Absent until a run has built once.
      properties:
        global_prompt_chars:
          type: integer
        instructions_chars:
          description: The instruction layers, in the order WrapInstructions composed
            them.
          type: integer
        mcp_server_ids:
          description: MCPServerIDs are the servers the build wired up, in config
            order.
          items:
            type: string
          type: array
          uniqueItems: false
        memory_chars:
          type: integer
        skills_index_chars:
          type: integer
        tools:
          description: |-
            Tools are the locally attached tools, bucketed by what attached them.
            MCP is absent here: its tools live on the server, not on the agent, and
            are sized by the read path (which is also the only place a live server
            can be asked).
          items:
            $ref: '#/components/schemas/store.ToolBucket'
          type: array
          uniqueItems: false
      type: object
    store.Provider:
      properties:
        api_key:
          description: |-
            APIKey is masked on the way out (see sanitizeProvider) and restored from
            the stored row when a client sends the mask back.
          type: string
        auth_mode:
          description: |-
            AuthMode is "" (API key) or a mode the backend offers, validated against
            the provider registry on save.
          type: string
        base_url:
          type: string
        chatgpt_logged_in:
          description: |-
            ChatGPTLoggedIn is the API-facing derived login signal (set when
            sanitizing); the token itself never leaves the server.
          type: boolean
        created_at:
          type: string
        id:
          type: string
        name:
          type: string
        owner_id:
          type: string
        scope:
          description: 'Scope/OwnerID: row visibility and its permanent creator —
            decisions §5.29.'
          type: string
        type:
          description: |-
            Type selects the backend (bridge.ProviderType*). Empty means openai, the
            value that predates the field.
          type: string
        updated_at:
          type: string
      type: object
    store.ResilienceGroup:
      properties:
        fallback_models:
          type: string
        retry_enabled:
          type: boolean
        retry_policy:
          type: string
      type: object
    store.RunQuestion:
      properties:
        on_path:
          type: boolean
        question:
          type: string
        run_id:
          type: string
      type: object
    store.SandboxConfig:
      properties:
        config:
          description: |-
            Config holds the backend settings as JSON (DockerConfig). Stored as
            TEXT and sent to/received from the API as a raw JSON object (no
            double-encoding).
          items:
            type: integer
          type: array
          uniqueItems: false
        created_at:
          type: string
        id:
          type: string
        name:
          type: string
        revision:
          description: |-
            Revision counts this config's WRITES: 1 at creation, +1 on every update,
            name-only included. It is the row's concurrency control — the
            expected-revision CAS both update paths carry, and the predicate a
            first-run bind lands against (the workdir was validated on exactly this
            revision). Nothing keeps old revisions runnable: updates apply to everyone
            at the next run.
          type: integer
        type:
          description: Type is "docker" — the only backend (decisions §5.27).
          type: string
        updated_at:
          type: string
      type: object
    store.Session:
      properties:
        agent_config_id:
          type: string
        created_at:
          type: string
        hidden:
          description: |-
            Hidden marks a session that exists to serve another one — a background
            task's transcript. Listings leave it out by default.

            It is a column rather than a subquery over the tasks table because
            "hidden" belongs to the session: the list query had to know what a task
            was in order to exclude one, and anything else worth hiding would have
            had to teach it a second special case.
          type: boolean
        id:
          type: string
        name:
          type: string
        owner_id:
          description: |-
            OwnerID is the user the conversation belongs to — the only ownership
            column: a task's hidden session inherits it from its parent, a trigger
            fires into a session, an approval is filed on one. Content is the
            owner's alone; an admin may list, stop and delete (README "Ownership").
          type: string
        pinned:
          type: boolean
        planning:
          description: |-
            Planning is the session's plan phase: true means its next run starts
            read-only until a plan is approved. It is materialized here — not derived
            from the entry log — because it is read on every run and every session GET,
            and a scan of the whole history for the last marker was O(n) per read.
            The person sets it (the composer's plan toggle / a `/plan` message); the
            approved submit_plan clears it. A fork copies it, so a branched session
            inherits the phase it forked in.
          type: boolean
        project_id:
          type: string
        sandbox_id:
          description: |-
            SandboxID/ProjectID are the session's PERMANENT binding: the first
            sandbox-carrying run CAS-writes them (BindSandboxIfEmpty) and they are
            never rewritten — decisions §5.28.
          type: string
        updated_at:
          type: string
      type: object
    store.SessionGroup:
      properties:
        history_limit:
          description: HistoryLimit caps how many recent session items each turn loads
            (0 = all).
          type: integer
        prompt_id:
          type: string
        prompt_version:
          type: string
      type: object
    store.Skill:
      properties:
        content:
          description: |-
            Content is the full SKILL.md; capped at write time (maxSkillBytes) and
            omitted from list responses (ListMeta).
          type: string
        created_at:
          type: string
        description:
          type: string
        detached:
          description: |-
            Detached marks an imported skill edited in the workbench: a re-import
            skips it instead of overwriting the local edit.
          type: boolean
        id:
          type: string
        name:
          description: unique per scope (decisions §5.29)
          type: string
        owner_id:
          type: string
        repo_label:
          description: |-
            RepoLabel is SourceRepo reduced to the prefix of the model-facing name
            ("owner/repo", or the host). Materialized at write time (BeforeAppendModel)
            because it is what the unique name indexes key on: two source URLs can
            reduce to one label, and the index must refuse that collision — a
            duplicate qualified name would make read_skill's answer a coin flip
            (decisions §5.31).
          type: string
        scope:
          description: 'Scope/OwnerID: row visibility and its permanent creator —
            decisions §5.29.'
          type: string
        source_path:
          type: string
        source_repo:
          description: |-
            Source records where an imported skill came from — the repo or raw URL,
            the path inside the repo, and the commit it was fetched at — so a
            re-import can match and refresh it. All empty for a skill authored in
            the workbench.
          type: string
        source_sha:
          type: string
        updated_at:
          type: string
      type: object
    store.StepGate:
      description: |-
        Gate makes the step a CHECK: its final output decides which edge is taken
        (see StepGate). Nil means the run's own outcome decides — a failure is
        then structural, the step's run errored.
      properties:
        fail:
          type: string
        pass:
          type: string
      type: object
    store.Task:
      properties:
        agent_config_id:
          type: string
        attempt:
          description: |-
            Attempt counts this task's runs: 1 for the original, one more per retry.
            Zero reads as the first attempt — mirroring the SDK's AttemptNo()
            contract, so a row whose column was never set (an insert that omitted
            it) means what it already meant. (Not a migration concern: this server
            recreates its schema rather than altering it, so no pre-attempt rows
            survive an upgrade.)
          type: integer
        child_session_id:
          type: string
        created_at:
          type: string
        depth:
          description: |-
            Depth is how many task hops from a user-initiated run. Persisted because
            it is the ONLY input to the recursion bound: dropping it made every task
            report depth 0, so MaxDepth — the documented backstop against a task
            spawning tasks forever — could never trip on this host.
          type: integer
        dismissed:
          description: |-
            Dismissed hides a terminal task from the conversation's live strip; the
            panel still lists it. A retry clears it — the work is live again.
          type: boolean
        kind:
          description: |-
            Kind is the SDK's host-defined discriminator: "" for a sub-agent task,
            TaskKindWorkflow for a workflow execution.
          type: string
        label:
          type: string
        max_attempts:
          description: |-
            MaxAttempts is the ceiling this row's attempt is measured against —
            filled for the wire, not stored, because it is the task manager's
            configuration rather than a fact about the task. Clients take the
            PARAMETER rather than a precomputed "retryable", so their answer moves
            with the status they are already tracking instead of lagging a round trip
            behind it.
          type: integer
        parent_run_id:
          type: string
        parent_session_id:
          type: string
        run_id:
          description: |-
            RunID is the id of the task's CURRENT run: a retry replaces it, and so
            does each step of a workflow. It is distinct from the task id because the
            task is the durable entity and a run is one try at it — which is what
            makes a retry expressible at all.
          type: string
        state:
          description: |-
            State is the SDK's opaque per-job record — for a workflow, the encoded
            WorkflowState (the definition snapshot and where the sequence stands).
          items:
            type: integer
          type: array
          uniqueItems: false
        status:
          type: string
        summary:
          type: string
        task_id:
          type: string
        tool_call_id:
          type: string
        updated_at:
          type: string
      type: object
    store.TaskWithSession:
      properties:
        session_name:
          type: string
      type: object
    store.ToolBucket:
      properties:
        chars:
          type: integer
        count:
          type: integer
        source:
          type: string
        unavailable:
          description: |-
            Unavailable marks a bucket that could not be measured (an MCP server that
            is disconnected or did not answer). Reported as unknown, never as zero.
          type: boolean
      type: object
    store.TraceEvent:
      properties:
        created_at:
          type: string
        data:
          type: string
        detail:
          type: string
        ended_at:
          type: string
        error:
          type: string
        id:
          type: string
        kind:
          type: string
        name:
          type: string
        parent_id:
          type: string
        parent_run_id:
          description: |-
            ParentRunID is the run's LINEAGE: for a task wake-up run, the run whose
            spawn started the chain. Recorded on the trace itself so the panel's run
            grouping reads it directly — deriving it from task rows or notification
            text broke on every surface that does not carry them (forks above all).
          type: string
        payload_omitted:
          description: |-
            PayloadOmitted marks a summary row (TraceStore.ListSummaryBySession)
            whose Data had its payload fields left out; GetBySpan has them.
          type: boolean
        run_id:
          type: string
        session_id:
          type: string
        span_id:
          type: string
        started_at:
          type: string
      type: object
    store.User:
      properties:
        avatar_url:
          description: |-
            AvatarURL is the provider's picture URL, carried by /auth/me and loaded
            by the browser; the CSP admits the configured providers' image hosts.
          type: string
        created_at:
          type: string
        disabled_at:
          description: |-
            DisabledAt, when set, is when an admin switched the account off: no
            credential of theirs authenticates until it is cleared.
          type: string
        email:
          description: lowercased; unique via idx_users_email
          type: string
        id:
          type: string
        last_login_at:
          type: string
        name:
          type: string
        role:
          description: RoleAdmin | RoleMember
          type: string
        updated_at:
          type: string
      type: object
    store.Workflow:
      properties:
        budget:
          $ref: '#/components/schemas/store.WorkflowBudget'
        created_at:
          type: string
        description:
          description: |-
            Description says WHEN to run this, in one line. An agent matching a
            request against it is the only way a workflow starts, so it is required.
          type: string
        id:
          type: string
        name:
          type: string
        owner_id:
          type: string
        scope:
          description: 'Scope/OwnerID: row visibility and its permanent creator —
            decisions §5.29.'
          type: string
        steps:
          items:
            $ref: '#/components/schemas/store.WorkflowStep'
          type: array
          uniqueItems: false
        updated_at:
          type: string
      type: object
    store.WorkflowBudget:
      description: Budget bounds every execution of this workflow (zero fields = no
        bound).
      properties:
        max_laps:
          description: |-
            MaxLaps bounds how many times one execution may take the same backward
            edge (verify → exec, fix → review): the loop bound.
          type: integer
        max_minutes:
          type: integer
        max_steps:
          type: integer
        max_tokens:
          type: integer
      type: object
    store.WorkflowStep:
      properties:
        agent_config_id:
          description: |-
            AgentConfigID is which agent runs this step — the point of a workflow:
            plan, exec and verify are usually different agents on different models.
          type: string
        compact_before:
          description: CompactBefore folds the conversation into a summary before
            this step runs.
          type: boolean
        gate:
          $ref: '#/components/schemas/store.StepGate'
        id:
          description: |-
            ID is stable across edits of the definition, so an execution in flight
            and a "retry from here" keep naming the same step; a position would shift.
          type: string
        name:
          type: string
        on_failure:
          type: string
        on_success:
          description: |-
            OnSuccess and OnFailure name the step to run next — a step id, or
            WorkflowStepEnd to stop there. Their empty defaults differ: OnSuccess
            falls through to the NEXT step in the list (the last one ends the
            execution), an empty OnFailure fails the execution. A back-edge is how a
            sequence loops, bounded only by MaxStepRuns.
          type: string
        pause_before:
          description: |-
            PauseBefore holds the sequence before this step until a person approves
            it from the conversation that asked — a step-level gate, for the deploy
            or the send that must not happen unseen. Rejecting cancels the execution.
          type: boolean
        prompt:
          description: |-
            Prompt is the step's input, sent as the user turn that starts it. The
            previous steps are already in the session, so this instructs rather than
            re-passes their output.
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Value is "Bearer <token>" — the token printed at server startup
        (or set via --token).
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: 'REST API of agents-server, the web server over the agents-go SDK:
    sessions, agents, MCP servers, memories, settings, skills, provider routes, guardrails,
    and sandboxes. Runs are started over the WebSocket protocol (see the README);
    this spec covers the HTTP surface.'
  title: agents-server API
  version: "1.0"
openapi: 3.1.0
paths:
  /agents:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/store.AgentConfig'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - agents
    post:
      description: 'Secret fields (api_key, fallback_models[].api_key) are write-only:
        responses mask them with ********; sending the mask back keeps the stored
        value, "" clears it. Tool selections whose statically known tool names would
        collide are rejected.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/store.AgentConfig'
                description: Agent configuration
                summary: agent
        description: Agent configuration
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.AgentConfig'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create agent
      tags:
      - agents
  /agents/{id}:
    delete:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: deleted
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete agent
      tags:
      - agents
    get:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.AgentConfig'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get agent
      tags:
      - agents
    put:
      description: 'Full replace. Secret fields are write-only: send back the ********
        mask to keep the stored value, "" to clear it; a mask kept across a provider_type
        or base_url change is rejected (the stored key belongs to the previous destination).
        Tool selections whose statically known tool names would collide are rejected.'
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/store.AgentConfig'
                description: Agent configuration
                summary: agent
        description: Agent configuration
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.AgentConfig'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update agent
      tags:
      - agents
  /agents/{id}/owner:
    put:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.SetOwnerRequest'
                description: The new owner
                summary: body
        description: The new owner
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: malformed body, or no such user
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: name collision in the target owner's namespace
      security:
      - BearerAuth: []
      summary: Reassign an agent's owner (admin)
      tags:
      - agents
  /agents/{id}/scope:
    post:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.scopeReq'
                description: global or private
                summary: scope
        description: global or private
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: a promote holds non-global references
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: name collision in the target scope
      security:
      - BearerAuth: []
      summary: Change an agent's scope
      tags:
      - agents
  /agents/{id}/tools:
    get:
      description: Schema-only definitions (name, description, parameters) of every
        tool the agent would carry right now, excluding sandbox tools (no sandbox
        is selected). Tools are never executed from here.
      parameters:
      - description: Agent config ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/handler.playgroundTool'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
      security:
      - BearerAuth: []
      summary: Agent tool surface
      tags:
      - agents
  /approvals/{tool_call_id}/approve:
    post:
      description: 'Approves a pending tool call and resumes the run under its original
        run id; stream it via GET /runs/{id}/events (existing cursors stay valid).
        For exec_command, the optional body scope extends the approval: "once" (default),
        "same" (trust this exact command for the session), or "all" (trust every command).'
      parameters:
      - description: Tool call ID
        in: path
        name: tool_call_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.approveReq'
                description: Optional approval scope
                summary: body
        description: Optional approval scope
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.approvalResultResp'
          description: Accepted
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: session already has an active run
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Approve tool call
      tags:
      - approvals
  /approvals/{tool_call_id}/reject:
    post:
      description: Rejects a pending tool call and resumes the run under its original
        run id so the model can react.
      parameters:
      - description: Tool call ID
        in: path
        name: tool_call_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.rejectReq'
                description: Optional rejection reason
                summary: body
        description: Optional rejection reason
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.approvalResultResp'
          description: Accepted
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: session already has an active run
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Reject tool call
      tags:
      - approvals
  /auth/audit:
    get:
      parameters:
      - description: Page size (default 100, max 500)
        in: query
        name: limit
        schema:
          type: integer
      - description: An event id; the page before it
        in: query
        name: before
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/store.AuditEvent'
                type: array
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Audit log (admin)
      tags:
      - auth
  /auth/check:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Validate the presented credential
      tags:
      - auth
  /auth/config:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protocol.AuthConfig'
          description: OK
      summary: Auth configuration
      tags:
      - auth
  /auth/exchange:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protocol.AuthSession'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: unknown, used, or expired code
      summary: Exchange the one-time login code for a session token
      tags:
      - auth
  /auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: boolean
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: malformed body, or token login disabled (OAuth mode)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Unauthorized
      summary: Token login
      tags:
      - auth
  /auth/logout:
    post:
      responses:
        "204":
          description: signed out
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Sign out
      tags:
      - auth
  /auth/me:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protocol.UserInfo'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
  /auth/oauth/{provider}/callback:
    get:
      parameters:
      - description: Provider name
        in: path
        name: provider
        required: true
        schema:
          type: string
      - description: Authorize round-trip state
        in: query
        name: state
        required: true
        schema:
          type: string
      - description: Authorization code
        in: query
        name: code
        schema:
          type: string
      - description: The provider's error (a cancelled consent)
        in: query
        name: error
        schema:
          type: string
      responses:
        "302":
          description: redirect into the SPA
      summary: OAuth provider callback
      tags:
      - auth
  /auth/oauth/{provider}/start:
    get:
      parameters:
      - description: Provider name (e.g. google)
        in: path
        name: provider
        required: true
        schema:
          type: string
      responses:
        "302":
          description: redirect to the provider's authorize URL
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: unknown provider (or token mode)
      summary: Begin an OAuth login
      tags:
      - auth
  /auth/tokens:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/protocol.PatView'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: token mode
      security:
      - BearerAuth: []
      summary: List personal access tokens
      tags:
      - auth
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/protocol.PatCreated'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
      security:
      - BearerAuth: []
      summary: Create a personal access token
      tags:
      - auth
  /auth/tokens/{id}:
    delete:
      parameters:
      - description: Token ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: revoked
        "404":
