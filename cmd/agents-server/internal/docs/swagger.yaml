  /mcp-servers/{id}/tools:
    get:
      parameters:
      - description: MCP server ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/handler.mcpToolInfo'
                type: array
          description: OK
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: server not connected
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Gateway
      security:
      - BearerAuth: []
      summary: List MCP server tools
      tags:
      - mcp-servers
  /mcp-servers/oauth/callback:
    get:
      description: Browser-facing redirect target of the OAuth flow (no auth token
        required). Renders an HTML result page, not JSON.
      parameters:
      - description: OAuth state
        in: query
        name: state
        required: true
        schema:
          type: string
      - description: Authorization code
        in: query
        name: code
        required: true
        schema:
          type: string
      - description: Provider error, e.g. access_denied
        in: query
        name: error
        schema:
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: HTML result page
        "400":
          content:
            text/html:
              schema:
                type: string
          description: missing state or code parameter
      summary: MCP OAuth callback
      tags:
      - mcp-servers
  /memories:
    get:
      responses:
        "200":
