        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: server is disabled
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
