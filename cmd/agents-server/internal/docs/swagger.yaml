  /sessions/{id}/runs:
    get:
      description: Every run that left entries on the session, oldest first, each
        with the user text it started from (`question` — its own message, or for a
        regenerate the message it answered again) and whether its entries are on the
        active branch (`on_path`). What the trace panel labels a run by when its message
        lies outside the page of history it has loaded.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/store.RunQuestion'
                type: array
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List session runs
      tags:
      - sessions
    post:
      description: 'Starts an agent run on the session. Default returns 201 with a
        run id. With the header `Prefer: wait=N` (RFC 7240) the request is held up
        to N seconds (capped at 10 minutes): 200 with the final output when the run
        ends in time — or status "interrupted" when it pauses for tool approval (act
        via /sessions/{id}/approvals) — else 202 with the run id, still running (`Preference-Applied:
        wait=N` marks the honored wait). Fails 409 if the session already has an active
        run.'
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: wait=N — hold the request up to N seconds for the run to end
        in: header
        name: Prefer
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.createRunReq'
                description: Run input
                summary: run
        description: Run input
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: Final result (the wait ended with the run)
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.createRunResp'
          description: Created
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.createRunResp'
          description: Still running when the wait ran out
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: session already has an active run, or the sandbox config kept
            changing under the bind
      security:
      - BearerAuth: []
      summary: Start run
      tags:
      - runs
