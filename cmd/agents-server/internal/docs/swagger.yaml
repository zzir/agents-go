components:
  schemas:
    agents.ContextManagement:
      properties:
        compact_threshold:
          description: |-
            CompactThreshold is the token threshold at which compaction triggers for
            this entry. nil leaves it unset.
          type: integer
        type:
          $ref: '#/components/schemas/agents.ContextManagementType'
      type: object
    agents.ContextManagementType:
      description: Type is the entry type. Currently only "compaction" is supported.
      enum:
      - compaction
      type: string
      x-enum-varnames:
      - ContextManagementCompaction
    agents.Diagnostic:
      properties:
        code:
          $ref: '#/components/schemas/agents.ErrorCode'
        details:
          additionalProperties: {}
          description: Details carries type-specific fields (attempt number, model
            name, …).
          type: object
        message:
          description: Message is a one-line human-facing summary.
          type: string
        timestamp:
          type: string
        type:
          $ref: '#/components/schemas/agents.DiagnosticType'
      type: object
    agents.DiagnosticType:
      enum:
      - model_retry
      - model_fallback
      - stream_error
      - tool_panic
      - tool_timeout
      - compaction_failed
      - response_truncated
      - context_overflow
      type: string
      x-enum-varnames:
      - DiagModelRetry
      - DiagModelFallback
      - DiagStreamError
      - DiagToolPanic
      - DiagToolTimeout
      - DiagCompactionFailed
      - DiagResponseTruncated
      - DiagContextOverflow
    agents.ErrorCode:
      description: Code classifies the underlying error, when there was one.
      enum:
      - unknown
      - max_turns_exceeded
      - model_behavior
      - model_refusal
      - user_error
      - tool_timeout
      - tool_loop
      - tool_panic
      - guardrail_tripwire
      - sandbox_exec
      - mcp
      type: string
      x-enum-varnames:
      - CodeUnknown
      - CodeMaxTurns
      - CodeModelBehavior
      - CodeModelRefusal
      - CodeUserError
      - CodeToolTimeout
      - CodeToolLoop
      - CodeToolPanic
      - CodeGuardrailTripwire
      - CodeSandboxExec
      - CodeMCP
    agents.InputTokensDetails:
      description: InputTokensDetails aggregates the input token detail fields.
      properties:
        cache_write_tokens:
          description: |-
            CacheWriteTokens counts input tokens written to the prompt cache (surfaced
            by providers that bill cache writes separately). Older serialized RunState
            snapshots without the field decode to zero.
          type: integer
        cached_tokens:
          type: integer
      type: object
    agents.ItemDisplay:
      properties:
        arguments:
          description: Arguments is the raw JSON the model passed to the tool.
          type: string
        call_id:
          description: CallID ties a tool call to its output.
          type: string
        extra:
          additionalProperties: {}
          description: |-
            Extra carries whatever a tool's CustomDataExtractor produced. It is
            SDK-side only and never reaches the model.
          type: object
        is_error:
          description: IsError marks a tool result that reports a failure.
          type: boolean
        kind:
          description: |-
            Kind is the item kind: message, tool_call, tool_output, reasoning,
            handoff, unknown. An unrecognized kind must fall back, not fail.
          type: string
        output:
          description: Output is a tool result rendered as text.
          type: string
        renderer:
          description: |-
            Renderer is a tool's requested renderer ("diff", "terminal", "table", …),
            from ToolResult.Display. A consumer that does not know the name falls
            back to plain text rather than failing.
          type: string
        text:
          description: 'Text is the human-readable body: a message''s text, a reasoning
            summary.'
          type: string
        tool_name:
          description: ToolName is the tool being called, or the handoff tool.
          type: string
      type: object
    agents.ModelSettings:
      description: |-
        ModelSettings, when set, replaces the agent's configured settings — the
        replay dialog seeds it from the traced request so edits take effect.
      properties:
        context_management:
          description: |-
            ContextManagement configures server-side context management (e.g.
            compaction) for OpenAI Responses API requests. A nil/empty slice leaves it
            unset.
          items:
            $ref: '#/components/schemas/agents.ContextManagement'
          type: array
          uniqueItems: false
        frequency_penalty:
          type: number
        max_tokens:
          description: MaxTokens is the maximum number of output tokens to generate.
          type: integer
        metadata:
          additionalProperties:
            type: string
          description: Metadata is included with the model response call.
          type: object
        parallel_tool_calls:
          description: |-
            ParallelToolCalls controls whether the model may emit multiple tool calls
            in a single turn. nil defers to the provider default.
          type: boolean
        presence_penalty:
          type: number
        prompt_cache_key:
          description: |-
            PromptCacheKey is forwarded as the Responses API prompt_cache_key to
            improve prompt-cache hit rates. Empty means unset. Unlike the Python SDK,
            the runner never generates a key: callers set this (or ExtraBody) themselves.
          type: string
        prompt_cache_options:
          $ref: '#/components/schemas/agents.PromptCacheOptions'
        prompt_cache_retention:
          $ref: '#/components/schemas/agents.PromptCacheRetention'
        reasoning:
          $ref: '#/components/schemas/agents.Reasoning'
        response_include:
          description: ResponseInclude lists additional output data to include in
            the response.
          items:
            type: string
          type: array
          uniqueItems: false
        service_tier:
          $ref: '#/components/schemas/agents.ServiceTier'
        store:
          description: Store controls whether the provider stores the response for
            later retrieval.
          type: boolean
        temperature:
          type: number
        tool_choice:
          $ref: '#/components/schemas/agents.ToolChoice'
        top_logprobs:
          description: TopLogprobs requests logprobs for the top N tokens.
          type: integer
        top_p:
          type: number
        truncation:
          $ref: '#/components/schemas/agents.Truncation'
        verbosity:
          $ref: '#/components/schemas/agents.Verbosity'
      type: object
    agents.OutputTokensDetails:
      description: OutputTokensDetails aggregates the output token detail fields.
      properties:
        reasoning_tokens:
          type: integer
      type: object
    agents.PromptCacheMode:
      description: Mode is "implicit" (default) or "explicit". Empty leaves it unset.
      enum:
      - implicit
      - explicit
      type: string
      x-enum-varnames:
      - PromptCacheModeImplicit
      - PromptCacheModeExplicit
    agents.PromptCacheOptions:
      description: |-
        PromptCacheOptions configures prompt caching (mode and breakpoint TTL)
        for OpenAI Responses API requests. nil leaves it unset.
      properties:
        mode:
          $ref: '#/components/schemas/agents.PromptCacheMode'
        ttl:
          description: |-
            TTL is the minimum cache-entry lifetime, e.g. "30m" (currently the only
            supported value). Empty leaves it unset.
          type: string
      type: object
    agents.PromptCacheRetention:
      description: PromptCacheRetention is "in_memory" or "24h".
      enum:
      - in_memory
      - 24h
      type: string
      x-enum-varnames:
      - PromptCacheRetentionInMemory
      - PromptCacheRetention24h
    agents.Reasoning:
      description: Reasoning configures reasoning models.
      properties:
        effort:
          $ref: '#/components/schemas/agents.ReasoningEffort'
        summary:
          $ref: '#/components/schemas/agents.ReasoningSummary'
      type: object
    agents.ReasoningEffort:
      description: Effort is "minimal", "low", "medium" or "high".
      enum:
      - minimal
      - low
      - medium
      - high
      type: string
      x-enum-varnames:
      - ReasoningEffortMinimal
      - ReasoningEffortLow
      - ReasoningEffortMedium
      - ReasoningEffortHigh
    agents.ReasoningSummary:
      description: Summary is "auto", "concise" or "detailed".
      enum:
      - auto
      - concise
      - detailed
      type: string
      x-enum-varnames:
      - ReasoningSummaryAuto
      - ReasoningSummaryConcise
      - ReasoningSummaryDetailed
    agents.RequestUsage:
      properties:
        input_tokens:
          type: integer
        input_tokens_details:
          $ref: '#/components/schemas/agents.InputTokensDetails'
        output_tokens:
          type: integer
        output_tokens_details:
          $ref: '#/components/schemas/agents.OutputTokensDetails'
        total_tokens:
          type: integer
      type: object
    agents.ServiceTier:
      description: 'ServiceTier selects the processing tier: "auto", "default", "flex"
        or "priority".'
      enum:
      - auto
      - default
      - flex
      - priority
      type: string
      x-enum-varnames:
      - ServiceTierAuto
      - ServiceTierDefault
      - ServiceTierFlex
      - ServiceTierPriority
    agents.ToolChoice:
      description: ToolChoice controls tool selection. Empty means unset.
      enum:
      - auto
      - required
      - none
      type: string
      x-enum-varnames:
      - ToolChoiceAuto
      - ToolChoiceRequired
      - ToolChoiceNone
    agents.Truncation:
      description: Truncation is "auto" or "disabled". Empty means unset.
      enum:
      - auto
      - disabled
      type: string
      x-enum-varnames:
      - TruncationAuto
      - TruncationDisabled
    agents.Usage:
      properties:
        input_tokens:
          description: InputTokens is the total input tokens sent across all requests.
          type: integer
        input_tokens_details:
          $ref: '#/components/schemas/agents.InputTokensDetails'
        output_tokens:
          description: OutputTokens is the total output tokens received across all
            requests.
          type: integer
        output_tokens_details:
          $ref: '#/components/schemas/agents.OutputTokensDetails'
        request_usage_entries:
          description: RequestUsageEntries preserves the per-request usage breakdown.
          items:
            $ref: '#/components/schemas/agents.RequestUsage'
          type: array
          uniqueItems: false
        requests:
          description: Requests is the total number of LLM API calls made.
          type: integer
        total_tokens:
          description: TotalTokens is the total tokens sent and received across all
            requests.
          type: integer
      type: object
    agents.Verbosity:
      description: 'Verbosity constrains response verbosity: "low", "medium" or "high".'
      enum:
      - low
      - medium
      - high
      type: string
      x-enum-varnames:
      - VerbosityLow
      - VerbosityMedium
      - VerbosityHigh
    bridge.ChatGPTLoginResult:
      properties:
        authorize_url:
          type: string
        state:
          type: string
      type: object
    bridge.GuardrailDef:
      properties:
        blocking:
          type: boolean
        config:
          items:
            type: integer
          type: array
          uniqueItems: false
        description:
          type: string
        id:
          type: string
        mode:
          type: string
        name:
          type: string
        stages:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    bridge.RunInfo:
      properties:
        agent_config_id:
          type: string
        last_seq:
          type: integer
        run_id:
          type: string
        sandbox_id:
          type: string
        session_id:
          type: string
        status:
          $ref: '#/components/schemas/bridge.RunStatus'
        task:
          $ref: '#/components/schemas/bridge.TaskMeta'
      type: object
    bridge.RunStatus:
      enum:
      - running
      - interrupted
      - completed
      - error
      - cancelled
      type: string
      x-enum-varnames:
      - RunRunning
      - RunInterrupted
      - RunCompleted
      - RunErrored
      - RunCancelled
    bridge.TaskInfo:
      properties:
        agent:
          type: string
        label:
          type: string
        result:
          description: |-
            Result carries the task's full final output (task_status only — the
            wake notification and the UI card stay on the truncated Summary).
          type: string
        status:
          type: string
        summary:
          type: string
        task_id:
          type: string
      type: object
    bridge.TaskMeta:
      description: |-
        Task is set for background task runs (SessionID is then the task's own
        hidden session; Task carries the parent linkage).
      properties:
        label:
          type: string
        parent_run_id:
          type: string
        parent_session_id:
          type: string
        task_id:
          type: string
        tool_call_id:
          type: string
      type: object
    handler.APIError:
      properties:
        code:
          type: string
        message:
          type: string
      type: object
    handler.ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/handler.APIError'
      type: object
    handler.SessionApproval:
      properties:
        agent_config_id:
          type: string
        created_at:
          type: string
        run_id:
          type: string
        sandbox_id:
          type: string
        session_id:
          type: string
        task_id:
          type: string
        task_label:
          type: string
        tool_calls:
          description: |-
            ToolCalls is the JSON array of pending tool calls ([]PendingToolCall)
            shown to the user.
          items:
            type: integer
          type: array
          uniqueItems: false
        user_input:
          description: |-
            UserInput is the text of the message that started this paused turn. The
            SDK only persists the turn to `messages` on completion, so during the
            pause this is the only place the user's prompt is stored — the UI
            reconstructs the user bubble from it on reload.
          type: string
      type: object
    handler.approvalResultResp:
      properties:
        run_id:
          type: string
        status:
          type: string
      type: object
    handler.approveReq:
      properties:
        scope:
          type: string
      type: object
    handler.chatgptStatusResp:
      properties:
        logged_in:
          type: boolean
      type: object
    handler.cloneRequest:
      properties:
        url:
          type: string
      required:
      - url
      type: object
    handler.createRunReq:
      properties:
        agent_config_id:
          type: string
        input:
          type: string
        sandbox_id:
          type: string
      type: object
    handler.createRunResp:
      properties:
        run_id:
          type: string
        session_id:
          type: string
        status:
          type: string
      type: object
    handler.createSandboxReq:
      properties:
        config:
          items:
            type: integer
          type: array
          uniqueItems: false
        name:
          type: string
        type:
          type: string
      type: object
    handler.mcpConnectResp:
      properties:
        authorize_url:
          type: string
        state:
          type: string
        status:
          type: string
      type: object
    handler.mcpServerListItem:
      properties:
        config:
          description: |-
            Config holds the transport-specific settings as JSON: StdioMcpConfig for
            "stdio", HTTPMcpConfig for "streamable_http". Stored as TEXT and
            exchanged with the API as a raw JSON object.
          items:
            type: integer
          type: array
          uniqueItems: false
        created_at:
          type: string
        enabled:
          description: |-
            Enabled deliberately carries no bun default tag: with `default:true`,
            bun swaps a zero-value false for SQL DEFAULT on insert, silently
            enabling a server that was created with enabled=false.
          type: boolean
        has_oauth_token:
          description: |-
            HasOAuthToken reports whether a persisted OAuth token exists. It gates
            the "clear auth" action independently of the lifecycle status.
          type: boolean
        id:
          type: string
        name:
          type: string
        status:
          description: |-
            Status is the single derived lifecycle state: disabled, connecting,
            authorizing, needs_auth, disconnected, or connected.
          type: string
        transport_type:
          description: stdio | streamable_http
          type: string
        updated_at:
          type: string
      type: object
    handler.mcpServerReq:
      properties:
        config:
          description: |-
            Config is the transport-specific settings object, interpreted per
            TransportType (see store.StdioMcpConfig / store.HTTPMcpConfig).
          items:
            type: integer
          type: array
          uniqueItems: false
        enabled:
          type: boolean
        name:
          type: string
        transport_type:
          type: string
      type: object
    handler.mcpToolInfo:
      properties:
        description:
          type: string
        name:
          type: string
      type: object
    handler.memoryReq:
      properties:
        agent_config_id:
          type: string
        content:
          type: string
        key:
          type: string
        metadata:
          type: string
      type: object
    handler.playgroundReq:
      properties:
        agent_config_id:
          description: AgentConfigID selects whose provider credentials and default
            model to use.
          type: string
        input_items:
          description: InputItems are Responses-format input items, as edited by the
            user.
          items:
            items:
              type: integer
            type: array
          type: array
          uniqueItems: false
        model:
          description: Model optionally overrides the agent's model.
          type: string
        model_settings:
          $ref: '#/components/schemas/agents.ModelSettings'
        system_instructions:
          description: SystemInstructions is the system prompt to send.
          type: string
        tools:
          description: |-
            Tools are schema-only tool definitions echoed back from the traced
            request, so the model sees the same tool surface and can emit function
            calls. They are never executed: a single GetResponse runs no tool loop.
          items:
            $ref: '#/components/schemas/handler.playgroundTool'
          type: array
          uniqueItems: false
      type: object
    handler.playgroundResp:
      properties:
        duration_ms:
          type: integer
        output:
          items:
            type: integer
          type: array
          uniqueItems: false
        usage:
          $ref: '#/components/schemas/agents.Usage'
      type: object
    handler.playgroundTool:
      properties:
        description:
          type: string
        name:
          type: string
        parameters:
          additionalProperties: {}
          type: object
      type: object
    handler.providerRouteReq:
      properties:
        api_key:
          type: string
        base_url:
          type: string
        prefix:
          type: string
      type: object
    handler.rejectReq:
      properties:
        reason:
          type: string
      type: object
    handler.sandboxTestResp:
      properties:
        detail:
          type: string
        ok:
          type: boolean
      type: object
    handler.sessionCreateReq:
      properties:
        agent_config_id:
          description: AgentConfigID optionally binds the session to an agent up front.
          type: string
        name:
          type: string
      type: object
    handler.sessionPatchReq:
      properties:
        name:
          type: string
        pinned:
          type: boolean
      type: object
    handler.setSettingReq:
      properties:
        value:
          type: string
      type: object
    handler.skillContentResp:
      properties:
        content:
          type: string
        name:
          type: string
        path:
          type: string
      type: object
    handler.skillEntry:
      properties:
        description:
          type: string
        name:
          type: string
        path:
          type: string
      type: object
    handler.skillRepoResp:
      properties:
        name:
          type: string
        skills:
          items:
            $ref: '#/components/schemas/handler.skillEntry'
          type: array
          uniqueItems: false
      type: object
    handler.taskStopReq:
      properties:
        graceful:
          type: boolean
      type: object
    store.AgentConfig:
      properties:
        approval:
          $ref: '#/components/schemas/store.ApprovalGroup'
        behavior:
          $ref: '#/components/schemas/store.BehaviorGroup'
        chatgpt_logged_in:
          description: |-
            ChatGPTLoggedIn is the API-facing derived login signal (set by the
            handler when sanitizing); the token itself never leaves the server.
          type: boolean
        compaction:
          $ref: '#/components/schemas/store.CompactionGroup'
        created_at:
          type: string
        error_handlers:
          description: |-
            ErrorHandlers is a JSON object keyed by error kind (max_turns /
            model_refusal / invalid_final_output), each entry carrying a static
            final_output (a JSON value) and an optional exclude_from_history flag.
            Empty means every run error stays fatal.
          type: string
        guardrails:
          $ref: '#/components/schemas/store.GuardrailGroup'
        handoffs:
          type: string
        id:
          type: string
        instructions:
          type: string
        model:
          type: string
        model_settings:
          description: The following are already single JSON blobs, kept as their
            own columns.
          type: string
        name:
          type: string
        provider:
          $ref: '#/components/schemas/store.ProviderGroup'
        resilience:
          $ref: '#/components/schemas/store.ResilienceGroup'
        session:
          $ref: '#/components/schemas/store.SessionGroup'
        skills:
          type: string
        tools:
          type: string
        updated_at:
          type: string
      type: object
    store.ApprovalGroup:
      properties:
        approve_tools:
          type: string
      type: object
    store.BehaviorGroup:
      properties:
        disable_tool_choice_reset:
          type: boolean
        handoff_description:
          type: string
        handoff_input_filter:
          type: string
        max_tool_concurrency:
          type: integer
        max_turns:
          type: integer
        reasoning_item_id_policy:
          description: |-
            ReasoningItemIDPolicy is "" / "preserve" (keep reasoning-item ids across
            turns) or "omit" (strip them).
          type: string
        stop_at_tools:
          description: |-
            StopAtTools is a comma-separated list of tool names; the run ends after a
            turn that called any of them, instead of feeding the results back to the
            model. Empty means the run continues until the model stops on its own.
          type: string
        tool_not_found_behavior:
          type: string
      type: object
    store.CompactionGroup:
      properties:
        compaction_enabled:
          type: boolean
        compaction_model:
          type: string
        compaction_prompt:
          type: string
        compaction_threshold:
          type: integer
        compaction_window:
          type: integer
      type: object
    store.CompactionInfo:
      description: |-
        Compaction is present on a checkpoint: what the pass folded away, so a
        reader can collapse those entries under it and offer them back.
      properties:
        excluded_ids:
          description: |-
            ExcludedIDs are the entries this checkpoint folded away. They are still
            in the session, marked compacted; this is what lets a reader collapse
            them under the checkpoint instead of leaving them loose in the history.
          items:
            type: string
          type: array
          uniqueItems: false
        tokens_after:
          type: integer
        tokens_before:
          type: integer
      type: object
    store.EntryView:
      properties:
        compacted:
          type: boolean
        compaction:
          $ref: '#/components/schemas/store.CompactionInfo'
        content:
          description: Content is the readable text, for a renderer that wants one
            string.
          type: string
        created_at:
          type: string
        diagnostics:
          items:
            $ref: '#/components/schemas/agents.Diagnostic'
          type: array
          uniqueItems: false
        display:
          $ref: '#/components/schemas/agents.ItemDisplay'
        entry_id:
          type: string
        id:
          type: integer
        kind:
          type: string
        parent_id:
          type: string
        role:
          description: |-
            Role is who produced the entry, from its recorded provenance rather than
            re-parsed from the item. Provenance is not something to guess at.
          type: string
        run_id:
          type: string
        usage:
          $ref: '#/components/schemas/agents.RequestUsage'
      type: object
    store.Guardrail:
      properties:
        blocking:
          description: |-
            Blocking, at the input stage, runs the guardrail to completion BEFORE the
            first model call (a gate) instead of racing it — a tripwire then prevents
            the call and any token spend. No effect at the other stages.
          type: boolean
        config:
          items:
            type: integer
          type: array
          uniqueItems: false
        created_at:
          type: string
        description:
          type: string
        id:
          type: string
        mode:
          description: regex | max_length
          type: string
        name:
          type: string
        stages:
          description: |-
            Stages are the run stages this guardrail inspects: input, output,
            tool_input, tool_output. One definition covering several is the SDK's
            model — a content scanner that should see the input, the tool arguments
            and the final output is one guardrail, not three near-identical copies.
          items:
            type: string
          type: array
          uniqueItems: false
        updated_at:
          type: string
      type: object
    store.GuardrailGroup:
      properties:
        guardrails:
          description: |-
            Guardrails is a JSON array of guardrail names. One list, not one per
            stage: a guardrail carries the stages it inspects, so naming it twice
            would be naming the same value twice.
          type: string
        output_schema:
          type: string
      type: object
    store.Memory:
      properties:
        agent_config_id:
          type: string
        content:
          type: string
        created_at:
          type: string
        id:
          type: string
        key:
          type: string
        metadata:
          type: string
        updated_at:
          type: string
      type: object
    store.ProviderGroup:
      description: |-
        The remaining knobs are grouped into JSON category columns (see
        agent_config_groups.go) so the table holds only category columns and a new
        setting needs no schema change. In the REST API each is a nested object.
      properties:
        api_key:
          type: string
        auth_mode:
          type: string
        base_url:
          type: string
        provider_type:
          type: string
      type: object
    store.ProviderRoute:
      properties:
        api_key:
          type: string
        base_url:
          type: string
        created_at:
          type: string
        id:
          type: string
        prefix:
          type: string
        updated_at:
          type: string
      type: object
    store.ResilienceGroup:
      properties:
        fallback_models:
          type: string
        retry_enabled:
          type: boolean
        retry_policy:
          type: string
      type: object
    store.SandboxConfig:
      properties:
        config:
          description: |-
            Config holds the backend-specific settings as JSON: LocalConfig for
            "local", DockerConfig for "docker", SSHConfig for "ssh". Stored as TEXT
            and sent to/received from the API as a raw JSON object (no
            double-encoding).
          items:
            type: integer
          type: array
          uniqueItems: false
        created_at:
          type: string
        id:
          type: string
        name:
          type: string
        terminal:
          description: |-
            Terminal reports whether this sandbox can host an interactive web
            terminal (ssh always; docker only in persistent mode; local never, by
            design). Computed per response by the handler, never stored.
          type: boolean
        type:
          description: local | docker | ssh
          type: string
        updated_at:
          type: string
      type: object
    store.Session:
      properties:
        agent_config_id:
          type: string
        created_at:
          type: string
        hidden:
          description: |-
            Hidden marks a session that exists to serve another one — a background
            task's transcript. Listings leave it out by default.

            It is a column rather than a subquery over the tasks table because
            "hidden" belongs to the session: the list query had to know what a task
            was in order to exclude one, and anything else worth hiding would have
            had to teach it a second special case.
          type: boolean
        id:
          type: string
        name:
          type: string
        pinned:
          type: boolean
        updated_at:
          type: string
      type: object
    store.SessionGroup:
      properties:
        history_limit:
          description: HistoryLimit caps how many recent session items each turn loads
            (0 = all).
          type: integer
        prompt_id:
          type: string
        prompt_version:
          type: string
        use_previous_response_id:
          type: boolean
      type: object
    store.Setting:
      properties:
        key:
          type: string
        value:
          type: string
      type: object
    store.Task:
      properties:
        agent_config_id:
          type: string
        child_session_id:
          type: string
        created_at:
          type: string
        label:
          type: string
        parent_run_id:
          type: string
        parent_session_id:
          type: string
        run_id:
          description: |-
            RunID is the id of the task's current run attempt. Today a task has
            exactly one attempt (retries would update this and add an attempts
            table); it is deliberately distinct from the task id so the public
            model does not lock the two together.
          type: string
        status:
          type: string
        summary:
          type: string
        task_id:
          type: string
        tool_call_id:
          type: string
        updated_at:
          type: string
      type: object
    store.TraceEvent:
      properties:
        created_at:
          type: string
        data:
          type: string
        detail:
          type: string
        ended_at:
          type: string
        error:
          type: string
        id:
          type: integer
        kind:
          type: string
        name:
          type: string
        parent_id:
          type: string
        run_id:
          type: string
        session_id:
          type: string
        span_id:
          type: string
        started_at:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Value is "Bearer <token>" — the token printed at server startup
        (or set via --token).
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: 'REST API of agents-server, the web server over the agents-go SDK:
    sessions, agents, MCP servers, memories, settings, skills, provider routes, guardrails,
    and sandboxes. Runs are started over the WebSocket protocol (see the README);
    this spec covers the HTTP surface.'
  title: agents-server API
  version: "1.0"
openapi: 3.1.0
paths:
  /agents:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/store.AgentConfig'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - agents
    post:
      description: 'Secret fields (api_key, fallback_models[].api_key) are write-only:
        responses mask them with ********; sending the mask back keeps the stored
        value, "" clears it. use_previous_response_id is rejected (incompatible with
        the server-side session store), as are tool selections whose statically known
        tool names would collide.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/store.AgentConfig'
                description: Agent configuration
                summary: agent
        description: Agent configuration
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.AgentConfig'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Create agent
      tags:
      - agents
  /agents/{id}:
    delete:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: deleted
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Delete agent
      tags:
      - agents
    get:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.AgentConfig'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Get agent
      tags:
      - agents
    put:
      description: 'Full replace. Secret fields are write-only: send back the ********
        mask to keep the stored value, "" to clear it. use_previous_response_id is
        rejected (incompatible with the server-side session store), as are tool selections
        whose statically known tool names would collide.'
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/store.AgentConfig'
                description: Agent configuration
                summary: agent
        description: Agent configuration
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/store.AgentConfig'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Update agent
      tags:
      - agents
  /agents/{id}/chatgpt/login:
    post:
      description: Starts the OAuth flow; open authorize_url in a browser. The callback
        is served by a temporary local server on port 1455.
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bridge.ChatGPTLoginResult'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Start ChatGPT login
      tags:
      - agents
  /agents/{id}/chatgpt/logout:
    post:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: logged out
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: ChatGPT logout
      tags:
      - agents
  /agents/{id}/chatgpt/status:
    get:
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.chatgptStatusResp'
          description: OK
      security:
      - BearerAuth: []
      summary: ChatGPT login status
      tags:
      - agents
  /approvals/{tool_call_id}/approve:
    post:
      description: 'Approves a pending tool call and resumes the run under its original
        run id; stream it via GET /runs/{id}/events (existing cursors stay valid).
        For exec_command, the optional body scope extends the approval: "once" (default),
        "same" (trust this exact command for the session), or "all" (trust every command).'
      parameters:
      - description: Tool call ID
        in: path
        name: tool_call_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.approveReq'
                description: Optional approval scope
                summary: body
        description: Optional approval scope
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.approvalResultResp'
          description: Accepted
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: session already has an active run
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Approve tool call
      tags:
      - approvals
  /approvals/{tool_call_id}/reject:
    post:
      description: Rejects a pending tool call and resumes the run under its original
        run id so the model can react.
      parameters:
      - description: Tool call ID
        in: path
        name: tool_call_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/handler.rejectReq'
                description: Optional rejection reason
                summary: body
        description: Optional rejection reason
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.approvalResultResp'
          description: Accepted
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: session already has an active run
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Reject tool call
      tags:
      - approvals
  /guardrails:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
