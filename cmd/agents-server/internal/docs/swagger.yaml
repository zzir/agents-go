      - description: Session ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Block until the run finishes
        in: query
        name: wait
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
