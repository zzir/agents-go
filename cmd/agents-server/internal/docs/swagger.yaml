components:
  schemas:
    agents.ContextManagement:
      properties:
        compact_threshold:
          description: |-
            CompactThreshold is the token threshold at which compaction triggers for
            this entry. nil leaves it unset.
          type: integer
        type:
          $ref: '#/components/schemas/agents.ContextManagementType'
      type: object
    agents.ContextManagementType:
      description: Type is the entry type. Currently only "compaction" is supported.
      enum:
      - compaction
      type: string
      x-enum-varnames:
      - ContextManagementCompaction
    agents.Diagnostic:
      properties:
        code:
          $ref: '#/components/schemas/session.ErrorCode'
        details:
          additionalProperties: {}
          description: Details carries type-specific fields (attempt number, model
            name, …).
          type: object
        message:
          description: Message is a one-line human-facing summary.
          type: string
        timestamp:
          type: string
        type:
          $ref: '#/components/schemas/session.DiagnosticType'
      type: object
    agents.InputTokensDetails:
      description: InputTokensDetails aggregates the input token detail fields.
      properties:
        cache_write_tokens:
          description: |-
            CacheWriteTokens counts input tokens written to the prompt cache (surfaced
            by providers that bill cache writes separately). Older serialized RunState
            snapshots without the field decode to zero.
          type: integer
        cached_tokens:
          type: integer
      type: object
    agents.ItemDisplay:
      properties:
        arguments:
          description: Arguments is the raw JSON the model passed to the tool.
          type: string
        call_id:
          description: CallID ties a tool call to its output.
          type: string
        extra:
          additionalProperties: {}
          description: |-
            Extra carries whatever a tool's CustomDataExtractor produced. It is
            SDK-side only and never reaches the model.
          type: object
        is_error:
          description: IsError marks a tool result that reports a failure.
          type: boolean
        kind:
          description: |-
            Kind is the item kind: message, tool_call, tool_output, reasoning,
            handoff, unknown. An unrecognized kind must fall back, not fail.
          type: string
        output:
          description: Output is a tool result rendered as text.
          type: string
        renderer:
          description: |-
            Renderer is a tool's requested renderer ("diff", "terminal", "table", …),
            from ToolResult.Display. A consumer that does not know the name falls
            back to plain text rather than failing.
          type: string
        summary:
          description: |-
            Summary is the one-line account of what happened ("3 files changed"),
            for where the full Output would drown the timeline. Empty means render
            what the other fields already carry.
          type: string
        text:
          description: 'Text is the human-readable body: a message''s text, a reasoning
            summary.'
          type: string
        title:
          description: |-
            Title is the card heading, when the tool name is not it — a task's
            label, "Apply patch" over "apply_patch". Empty means fall back to
            ToolName: an override, never required, per the display contract.
          type: string
        tool_name:
          description: ToolName is the tool being called, or the handoff tool.
          type: string
      type: object
    agents.ModelSettings:
      description: |-
        ModelSettings, when set, replaces the agent's configured settings — the
        replay dialog seeds it from the traced request so edits take effect.
      properties:
        context_management:
          description: |-
            ContextManagement configures server-side context management (e.g.
            compaction) for OpenAI Responses API requests. A nil/empty slice leaves it
            unset.
          items:
            $ref: '#/components/schemas/agents.ContextManagement'
          type: array
          uniqueItems: false
        max_tokens:
          description: MaxTokens is the maximum number of output tokens to generate.
          type: integer
        metadata:
          additionalProperties:
            type: string
          description: Metadata is included with the model response call.
          type: object
        parallel_tool_calls:
          description: |-
            ParallelToolCalls controls whether the model may emit multiple tool calls
            in a single turn. nil defers to the provider default.
          type: boolean
        prompt_cache_key:
          description: |-
            PromptCacheKey is forwarded as the Responses API prompt_cache_key to
            improve prompt-cache hit rates. Empty means unset. The runner never
            generates a key — callers set this (or ExtraBody) themselves.
          type: string
        prompt_cache_options:
          $ref: '#/components/schemas/agents.PromptCacheOptions'
        prompt_cache_retention:
          $ref: '#/components/schemas/agents.PromptCacheRetention'
        reasoning:
          $ref: '#/components/schemas/agents.Reasoning'
        response_include:
          description: ResponseInclude lists additional output data to include in
            the response.
          items:
            type: string
          type: array
          uniqueItems: false
        service_tier:
          $ref: '#/components/schemas/agents.ServiceTier'
        store:
          description: Store controls whether the provider stores the response for
            later retrieval.
          type: boolean
        temperature:
          type: number
        tool_choice:
          $ref: '#/components/schemas/agents.ToolChoice'
        top_logprobs:
          description: TopLogprobs requests logprobs for the top N tokens.
          type: integer
        top_p:
          type: number
        truncation:
          $ref: '#/components/schemas/agents.Truncation'
        verbosity:
          $ref: '#/components/schemas/agents.Verbosity'
      type: object
    agents.OutputTokensDetails:
      description: OutputTokensDetails aggregates the output token detail fields.
      properties:
        reasoning_tokens:
          type: integer
      type: object
    agents.PromptCacheMode:
      description: Mode is "implicit" (default) or "explicit". Empty leaves it unset.
      enum:
      - implicit
      - explicit
      type: string
      x-enum-varnames:
      - PromptCacheModeImplicit
      - PromptCacheModeExplicit
    agents.PromptCacheOptions:
      description: |-
        PromptCacheOptions configures prompt caching (mode and breakpoint TTL)
        for OpenAI Responses API requests. nil leaves it unset.
      properties:
        mode:
          $ref: '#/components/schemas/agents.PromptCacheMode'
        ttl:
          description: |-
            TTL is the minimum cache-entry lifetime, e.g. "30m" (currently the only
            supported value). Empty leaves it unset.
          type: string
      type: object
    agents.PromptCacheRetention:
      description: PromptCacheRetention is "in_memory" or "24h".
      enum:
      - in_memory
      - 24h
      type: string
      x-enum-varnames:
      - PromptCacheRetentionInMemory
      - PromptCacheRetention24h
    agents.Reasoning:
      description: Reasoning configures reasoning models.
      properties:
        effort:
          $ref: '#/components/schemas/agents.ReasoningEffort'
        summary:
          $ref: '#/components/schemas/agents.ReasoningSummary'
      type: object
    agents.ReasoningEffort:
      description: Effort is "minimal", "low", "medium" or "high".
      enum:
      - minimal
      - low
      - medium
      - high
      type: string
      x-enum-varnames:
      - ReasoningEffortMinimal
      - ReasoningEffortLow
      - ReasoningEffortMedium
      - ReasoningEffortHigh
    agents.ReasoningSummary:
      description: Summary is "auto", "concise" or "detailed".
      enum:
      - auto
      - concise
      - detailed
      type: string
      x-enum-varnames:
      - ReasoningSummaryAuto
      - ReasoningSummaryConcise
      - ReasoningSummaryDetailed
    agents.RequestUsage:
      properties:
        input_tokens:
          type: integer
        input_tokens_details:
          $ref: '#/components/schemas/session.InputTokensDetails'
        output_tokens:
          type: integer
        output_tokens_details:
          $ref: '#/components/schemas/session.OutputTokensDetails'
        total_tokens:
          type: integer
      type: object
    agents.ServiceTier:
      description: 'ServiceTier selects the processing tier: "auto", "default", "flex"
        or "priority".'
      enum:
      - auto
      - default
      - flex
      - priority
      type: string
      x-enum-varnames:
      - ServiceTierAuto
      - ServiceTierDefault
      - ServiceTierFlex
      - ServiceTierPriority
    agents.ToolChoice:
      description: ToolChoice controls tool selection. Empty means unset.
      enum:
      - auto
      - required
      - none
      type: string
      x-enum-varnames:
      - ToolChoiceAuto
      - ToolChoiceRequired
      - ToolChoiceNone
    agents.Truncation:
      description: Truncation is "auto" or "disabled". Empty means unset.
      enum:
      - auto
      - disabled
      type: string
      x-enum-varnames:
      - TruncationAuto
      - TruncationDisabled
    agents.Usage:
      properties:
        input_tokens:
          description: InputTokens is the total input tokens sent across all requests.
          type: integer
        input_tokens_details:
          $ref: '#/components/schemas/agents.InputTokensDetails'
        output_tokens:
          description: OutputTokens is the total output tokens received across all
            requests.
          type: integer
        output_tokens_details:
          $ref: '#/components/schemas/agents.OutputTokensDetails'
        request_usage_entries:
          description: RequestUsageEntries preserves the per-request usage breakdown.
          items:
            $ref: '#/components/schemas/agents.RequestUsage'
          type: array
          uniqueItems: false
        requests:
          description: Requests is the total number of LLM API calls made.
          type: integer
        total_tokens:
          description: TotalTokens is the total tokens sent and received across all
            requests.
          type: integer
      type: object
    agents.Verbosity:
      description: 'Verbosity constrains response verbosity: "low", "medium" or "high".'
      enum:
      - low
      - medium
      - high
      type: string
      x-enum-varnames:
      - VerbosityLow
      - VerbosityMedium
      - VerbosityHigh
    bridge.Fired:
      properties:
        agent:
          type: string
        attempt:
          description: 'Attempt counts the task''s runs: 1 for the original, one more
            per retry.'
          type: integer
        kind:
          description: Kind is "" for a sub-agent task, "workflow" for an execution.
          type: string
        label:
          type: string
        max_attempts:
          description: |-
            MaxAttempts is the ceiling Attempt is measured against: a client offering
            a retry compares the two rather than being told the answer, so its offer
            follows the status it already tracks. Capacity is not part of it — a
            retry can still be refused when the parent session is full.
          type: integer
        result:
          description: |-
            Result carries the task's full final output (task_status only — the
            wake notification and the UI card stay on the truncated Summary).
          type: string
        run_id:
          type: string
        status:
          type: string
        summary:
          type: string
        task_id:
          type: string
      type: object
    bridge.RunInfo:
      properties:
        agent_config_id:
          type: string
        last_seq:
          type: integer
        project_id:
          type: string
        run_id:
          type: string
        sandbox_id:
          type: string
        session_id:
          type: string
        status:
          $ref: '#/components/schemas/bridge.RunStatus'
        task:
          $ref: '#/components/schemas/bridge.TaskMeta'
      type: object
    bridge.RunStatus:
      enum:
      - running
      - interrupted
      - completed
      - error
      - cancelled
      type: string
      x-enum-varnames:
      - RunRunning
      - RunInterrupted
      - RunCompleted
      - RunErrored
      - RunCancelled
    bridge.TaskInfo:
      properties:
        agent:
          type: string
        attempt:
          description: 'Attempt counts the task''s runs: 1 for the original, one more
            per retry.'
          type: integer
        kind:
          description: Kind is "" for a sub-agent task, "workflow" for an execution.
          type: string
        label:
          type: string
        max_attempts:
          description: |-
            MaxAttempts is the ceiling Attempt is measured against: a client offering
            a retry compares the two rather than being told the answer, so its offer
            follows the status it already tracks. Capacity is not part of it — a
            retry can still be refused when the parent session is full.
          type: integer
        result:
          description: |-
            Result carries the task's full final output (task_status only — the
            wake notification and the UI card stay on the truncated Summary).
          type: string
        status:
          type: string
        summary:
          type: string
        task_id:
          type: string
      type: object
    bridge.TaskMeta:
      description: |-
        Task is set for background task runs (SessionID is then the task's own
        hidden session; Task carries the parent linkage).
      properties:
        attempt:
          description: |-
            Attempt is which run of the task this is: 1 for the original, more after a
            retry. It rides on run.started so a client can tell a NEW attempt from a
            replay of the old one.
          type: integer
        kind:
          description: 'Kind is the task''s kind: "" a sub-agent task, "workflow"
            an execution.'
          type: string
        label:
          type: string
        max_attempts:
          description: MaxAttempts is the ceiling Attempt is measured against.
          type: integer
        parent_run_id:
          type: string
        parent_session_id:
          type: string
        task_id:
          type: string
        tool_call_id:
          type: string
      type: object
    docker.ManagedContainer:
      properties:
        created:
          type: string
        image:
          type: string
        name:
          type: string
        state:
          description: running | exited | ...
          type: string
        status:
          description: human-readable, e.g. "Up 2 hours"
          type: string
      type: object
    guardrails.Def:
      properties:
        blocking:
          type: boolean
        config:
          items:
            type: integer
          type: array
          uniqueItems: false
        description:
          type: string
        id:
          type: string
        mode:
          type: string
        name:
          type: string
        stages:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    handler.CompactResponse:
      properties:
        after_items:
          type: integer
        before_items:
          type: integer
        compacted:
          type: boolean
      type: object
    handler.ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/protocol.APIError'
      type: object
    handler.ServerInfo:
      properties:
        max_tasks:
          description: |-
            MaxTasks is the effective cap, never the raw flag — 0 on the command
            line means the built-in default, and reporting the 0 would be a lie.
          type: integer
        version:
          type: string
        workspace:
          description: |-
            Workspace is absolute: the relative default (".") means nothing to a
            browser on another machine.
          type: string
      type: object
    handler.SessionApproval:
      properties:
        agent_config_id:
          type: string
        created_at:
          type: string
        kind:
          description: |-
            Kind is what the decision is about: "" a tool call the run paused on
            (State is the run to resume), ApprovalKindStep a workflow step waiting to
            start (no run exists yet — approving launches it, rejecting cancels the
            execution).
          type: string
        project_id:
          type: string
        run_id:
          type: string
        sandbox_id:
          type: string
        session_id:
          type: string
        task_id:
          type: string
        task_label:
          type: string
        tool_calls:
          description: |-
            ToolCalls is the JSON array of pending tool calls ([]PendingToolCall)
            shown to the user.
          items:
            type: integer
          type: array
          uniqueItems: false
        user_input:
          description: |-
            UserInput is the text of the message that started this paused turn. The
            SDK only persists the turn to `messages` on completion, so during the
            pause this is the only place the user's prompt is stored — the UI
            reconstructs the user bubble from it on reload.
          type: string
      type: object
    handler.SetOwnerRequest:
      properties:
        user_id:
          type: string
      type: object
    handler.SettingView:
      properties:
        key:
          type: string
        unknown:
          description: |-
            Unknown marks a row the registry does not define — stored before
            validation existed, or left behind by a removed feature. Reads list it
            so it can be seen and deleted; writes refuse it.
          type: boolean
        value:
          type: string
      type: object
    handler.TaskPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/store.TaskWithSession'
          type: array
          uniqueItems: false
        total:
          description: Total is how many rows match the filter, for a pager.
          type: integer
      type: object
    handler.TriggerView:
      properties:
        agent_config_id:
          type: string
        brief:
          description: |-
            Brief leads every execution or turn this trigger starts; a webhook's
            payload is appended to it.
          type: string
        created_at:
          type: string
        enabled:
          type: boolean
        hook_path:
          description: HookPath is where a webhook trigger is called (POST, signed).
          type: string
        id:
          type: string
        kind:
          type: string
        last_error:
          type: string
        last_fired_at:
          description: |-
            What the last fire did, for the panel and for a cron that keeps failing:
            the id it started — a task for a workflow, a run for an agent turn — or
            why it started nothing.
          type: string
        last_started_id:
          type: string
        schedule:
          description: |-
            Schedule is the cron expression (five fields, or a descriptor such as
            @hourly or @every 10m). Cron kind only.
          type: string
        secret:
          description: Secret is set on the response that minted it, and never again.
          type: string
        secret_hint:
          description: SecretHint is the secret's tail, to tell one from another.
          type: string
        session_id:
          description: |-
            SessionID is the conversation the work reports to — or, for an agent
            turn, happens in.
          type: string
        target:
          description: |-
            Target says what a fire starts; WorkflowID or AgentConfigID names it,
            the other stays empty.
          type: string
        updated_at:
          type: string
        workflow_id:
          type: string
      type: object
    handler.UserLabel:
      properties:
        email:
          type: string
        id:
          type: string
        name:
          type: string
      type: object
    handler.UserPatchRequest:
      properties:
        disabled:
          type: boolean
        role:
          type: string
      type: object
    handler.approvalResultResp:
      properties:
        run_id:
          type: string
        status:
          type: string
      type: object
    handler.approveReq:
      properties:
        scope:
          type: string
      type: object
    handler.branchReq:
      properties:
        entry_id:
          type: string
      type: object
    handler.chatgptStatusResp:
      properties:
        logged_in:
          type: boolean
      type: object
    handler.createRunReq:
      properties:
        agent_config_id:
          type: string
        input:
          type: string
        plan:
          description: |-
            Plan asks the session to start this run in the planning phase (true) or
            out of it (false); absent leaves the phase as it stands.
          type: boolean
        project_id:
          description: |-
            ProjectID only matters until the session's first sandbox-carrying run
            permanently binds (sandbox_id, project_id); after that the server uses the
            bound values and ignores both fields.
          type: string
        sandbox_id:
          type: string
      type: object
    handler.createRunResp:
      properties:
        run_id:
          type: string
        session_id:
          type: string
        status:
          type: string
      type: object
    handler.createSandboxReq:
      properties:
        config:
          items:
            type: integer
          type: array
          uniqueItems: false
        name:
          type: string
        revision:
          description: |-
            Revision, on update only, is the revision the client's edit was based
            on (from GET/List): editing from a stale form is then 409 instead of
            silently overwriting a concurrent update. Absent (0) keeps
            last-writer-wins. Ignored on create.
          type: integer
        type:
          type: string
      type: object
    handler.fireReq:
      properties:
        payload:
          type: string
      type: object
    handler.mcpConnectResp:
      properties:
        authorize_url:
          type: string
        status:
          type: string
      type: object
    handler.mcpServerListItem:
      properties:
        config:
          description: |-
            Config holds the connection settings as JSON (HTTPMcpConfig — the
            streamable_http transport is the only one the server speaks, decisions §5.25).
            Stored as TEXT and exchanged with the API as a raw JSON object.
          items:
            type: integer
          type: array
          uniqueItems: false
        created_at:
          type: string
        enabled:
          description: |-
            Enabled deliberately carries no bun default tag: with `default:true`,
            bun swaps a zero-value false for SQL DEFAULT on insert, silently
            enabling a server that was created with enabled=false.
          type: boolean
        has_oauth_token:
          description: |-
            HasOAuthToken reports whether a persisted OAuth token exists. It gates
            the "clear auth" action independently of the lifecycle status.
          type: boolean
        id:
          type: string
        name:
          type: string
        owner_id:
          type: string
        scope:
          description: 'Scope/OwnerID: row visibility and its permanent creator —
            decisions §5.29.'
          type: string
        status:
          description: |-
            Status is the single derived lifecycle state: disabled, connecting,
            authorizing, needs_auth, disconnected, or connected.
          type: string
        updated_at:
          type: string
      type: object
    handler.mcpServerReq:
      properties:
        config:
          description: Config is the connection settings object (store.HTTPMcpConfig).
          items:
            type: integer
          type: array
          uniqueItems: false
        enabled:
          type: boolean
        name:
          type: string
        scope:
          description: 'Scope on create only: "global" (admin) or the "private" default.'
          type: string
      type: object
    handler.mcpToolInfo:
      properties:
        description:
          type: string
        name:
          type: string
      type: object
    handler.memoryReq:
      properties:
        agent_config_id:
          type: string
        content:
          type: string
        key:
          type: string
        metadata:
          type: string
      type: object
    handler.playgroundReq:
      properties:
        agent_config_id:
          description: AgentConfigID selects whose provider credentials and default
            model to use.
          type: string
        input_items:
          description: InputItems are Responses-format input items, as edited by the
            user.
          items:
            items:
              type: integer
            type: array
          type: array
          uniqueItems: false
        model:
          description: Model optionally overrides the agent's model.
          type: string
        model_settings:
          $ref: '#/components/schemas/agents.ModelSettings'
        output_schema:
          $ref: '#/components/schemas/handler.playgroundSchema'
        stream:
          description: |-
            Stream selects the SSE response: `delta`/`reasoning` text events as they
            arrive, then one `done` (output, usage, duration_ms, ttft_ms) or `error`.
          type: boolean
        system_instructions:
          description: SystemInstructions is the system prompt to send.
          type: string
        tools:
          description: |-
            Tools are schema-only tool definitions echoed back from the traced
            request, so the model sees the same tool surface and can emit function
            calls. They are never executed: a single Respond runs no tool loop.
          items:
            $ref: '#/components/schemas/handler.playgroundTool'
          type: array
          uniqueItems: false
      type: object
    handler.playgroundResp:
      properties:
        duration_ms:
          type: integer
        output:
          items:
            type: integer
          type: array
          uniqueItems: false
        ttft_ms:
          description: TTFTMS is the time to first streamed token; -1 on the non-streaming
            path.
          type: integer
        usage:
          $ref: '#/components/schemas/agents.Usage'
      type: object
    handler.playgroundSchema:
      description: |-
        OutputSchema, when set, requests structured output — echoed from the
        traced generation so a structured call replays as one. Without it a
        replay of such a call is a different request (free text).
      properties:
        name:
          type: string
        schema:
          additionalProperties: {}
          type: object
        strict:
          type: boolean
      type: object
    handler.playgroundTool:
      properties:
        description:
          type: string
        name:
          type: string
        parameters:
          additionalProperties: {}
          type: object
      type: object
    handler.projectDetail:
      properties:
        created_at:
          type: string
        env:
          items:
            $ref: '#/components/schemas/store.EnvVar'
          type: array
          uniqueItems: false
        id:
          type: string
        name:
          description: |-
            Name is display only — the storage is keyed by ID, so a rename moves
            nothing. Unique per (owner, sandbox) via idx_projects_owner_sandbox_name.
          type: string
        owner_id:
          type: string
        revision:
          description: |-
            Revision and RuntimeGen are the two counters SandboxConfig carries, for
            the same two jobs: the expected-revision CAS every update lands
            against, and the content generation that retires live containers — so
            a rename does not replace anyone's container.
          type: integer
        sandbox_id:
          type: string
        session_count:
          description: |-
            SessionCount is how many sessions bind this project — filled by List
            (scanonly), so a delete knows whether it will be refused.
          type: integer
        storage_hint:
          description: |-
            StorageHint names where the files live — the local daemon's host
            directory or the remote daemon's volume. Derived per response by the
            handler for admins only, never stored: deleting the row keeps the
            storage (decisions §5.28), so the UI can say where.
          type: string
        updated_at:
          type: string
      type: object
    handler.projectReq:
      properties:
        env:
          description: |-
            Env is the environment the project's container is created with;
            optional, and empty means none.
          items:
