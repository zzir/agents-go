  /sessions/{id}/traces:
    get:
      description: Without limit, returns all events oldest-first. With limit, returns
        the newest `limit` events (still oldest-first); page backwards by passing
        the smallest received id as before_id. `summary=true` leaves the payload fields
        (input, output, system_instructions, tools, handoffs, output_schema) out of
        each row's data — they are nearly all of a session's trace bytes — and marks
        such rows `payload_omitted`; GET /sessions/{id}/traces/{span_id} serves one
        span whole.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Max events to return; 0 or absent returns all
        in: query
        name: limit
        schema:
          type: integer
      - description: Only events with id < before_id (backwards cursor)
        in: query
        name: before_id
        schema:
          type: integer
      - description: Leave the payload fields out of data (rows marked payload_omitted)
        in: query
        name: summary
        schema:
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/store.TraceEvent'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handler.ErrorResponse'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List session traces
      tags:
      - sessions
