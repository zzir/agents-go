        required: true
        schema:
          type: string
      - description: Max entries to return; 0 or absent returns all
        in: query
        name: limit
        schema:
          type: integer
      - description: Only entries with id < before_id (backwards cursor)
        in: query
        name: before_id
        schema:
          type: integer
