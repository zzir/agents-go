<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agents-go</title>
  <!-- An explicit empty icon: without a link the browser requests
       /favicon.ico and logs a 404 on every load. -->
  <link rel="icon" href="data:," />
  <meta name="theme-color" content="#ffffff" />
  <!-- Theme init, inline so it runs before first paint — the body background
       below keys off the attributes, and setting them from React would flash
       white for dark-mode users. ThemeProvider takes over after mount. -->
  <script>
    (function () {
      var get = function (key, fallback) { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } };
      var p = get('theme', 'system');
      var d = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var hc = get('theme.highContrast', '') === 'true' ? '_high_contrast' : '';
      var dark = get('theme.dark', 'dark');
      var h = document.documentElement;
      h.setAttribute('data-color-mode', d ? 'dark' : 'light');
      h.setAttribute('data-light-theme', get('theme.light', 'light') + hc);
      h.setAttribute('data-dark-theme', dark + hc);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = !d ? '#ffffff' : dark === 'dark_dimmed' ? '#212830' : hc ? '#010409' : '#0d1117';
    })();
  </script>
  <style>
    #root:not(:has(> *)) { visibility: hidden; }
    body { background: #fff; }
    html[data-color-mode="dark"] body { background: #0d1117; }
    html[data-color-mode="dark"][data-dark-theme$="_high_contrast"] body { background: #010409; }
    html[data-color-mode="dark"][data-dark-theme^="dark_dimmed"] body { background: #212830; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
