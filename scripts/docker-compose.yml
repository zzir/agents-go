services:
  agents-server:
    image: ghcr.io/zzir/agents-server:latest
    container_name: agents-server
    restart: unless-stopped
    user: root
    command:
      - --host=0.0.0.0
      - --db=/data/agents.db
    ports:
      - "9527:9527"
    environment:
      - AGENTS_TOKEN=change-me-please
      # Outbound proxy for every HTTP request, OAuth login included; the proxy
      # must listen on an address the container can reach.
      # - HTTPS_PROXY=http://host.docker.internal:7890
      # - NO_PROXY=localhost,127.0.0.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agents-data:/data

volumes:
  agents-data:
    name: agents-server-data

networks:
  default:
    name: agents-server-network
